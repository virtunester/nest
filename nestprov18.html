<script>
  // ── Supabase Configuration ───────────────────────────────────────
  const SUPABASE_URL = 'https://cgtrlucacjrbtazidixn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDI1NDcsImV4cCI6MjA5NDExODU0N30.PX_IncuHZfsLl23OHt00XXyswycFtkmcUI3Su7BWkWY';
  const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODU0MjU0NywiZXhwIjoyMDk0MTE4NTQ3fQ.yVOLWHtAz4jyBwMWfmaCSfjbqBX7o8ibTeUtdwd1B4Q';

  // ── Telegram Notification Config ────────────────────────────────
  // ⚠️ 方案一：Bot Token 暴露在前端，风险已知且可接受（仅能被人给你发消息）
  // 替换下面两个值后生效：
  const TG_BOT_TOKEN = '8706490545:AAGoBoCT3h5aczF4a5zVx4MDRHhcmYIhgzg';   // 从 @BotFather 获取，格式: 123456789:ABC...
  const TG_CHAT_ID   = '7160516572';      // 你的管理员 chat_id（整数或字符串均可）

  // 发送 Telegram 消息（失败静默，不影响下单流程）
  const sendTelegramNotify = async (text) => {
    if (!TG_BOT_TOKEN || TG_BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') return; // 未配置则跳过
    try {
      await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TG_CHAT_ID,
          text: text,
          parse_mode: 'HTML'
        })
      });
    } catch (e) {
      console.warn('Telegram 通知发送失败（不影响下单）:', e);
    }
  };

  // ── 方案四：管理员轮询 + 新订单提醒 ────────────────────────────────
  const POLL_INTERVAL_MS = 30000; // 每30秒轮询一次
  let _adminPollTimer   = null;
  let _titleFlashTimer  = null;
  let _lastPendingCount = -1;    // -1 表示首次加载，不触发提醒

  // 播放 beep 提示音（Web Audio API，无需音频文件）
  const playNewOrderBeep = () => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach((delay, i) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = i === 1 ? 880 : 660;
        gain.gain.setValueAtTime(0.35, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.15);
      });
    } catch(e) { /* 浏览器不支持则静默 */ }
  };

  // Tab 标题闪烁
  const startTitleFlash = () => {
    if (_titleFlashTimer) return;
    const original = '全球账号特惠店';
    let on = true;
    _titleFlashTimer = setInterval(() => {
      document.title = on ? '🔔 新订单！' : original;
      on = !on;
    }, 900);
  };
  const stopTitleFlash = () => {
    if (_titleFlashTimer) { clearInterval(_titleFlashTimer); _titleFlashTimer = null; }
    document.title = '全球账号特惠店';
  };

  // ── 会话到期提醒 ────────────────────────────────────────────────
  const SESSION_WARN_BEFORE_MS = 2 * 60 * 1000; // 到期前 2 分钟提醒
  let _sessionWarnTimer = null;
  let _sessionExpireTimer = null;

  const clearSessionTimers = () => {
    if (_sessionWarnTimer)   { clearTimeout(_sessionWarnTimer);   _sessionWarnTimer   = null; }
    if (_sessionExpireTimer) { clearTimeout(_sessionExpireTimer); _sessionExpireTimer = null; }
    const banner = document.getElementById('admin-session-warn-banner');
    if (banner) banner.remove();
  };

  const showSessionWarnBanner = (remainingSec) => {
    let banner = document.getElementById('admin-session-warn-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'admin-session-warn-banner';
      banner.style.cssText = [
        'position:fixed','top:12px','left:50%','transform:translateX(-50%)',
        'z-index:9999','background:#b45309','color:#fff',
        'padding:10px 20px','border-radius:12px',
        'box-shadow:0 4px 16px rgba(0,0,0,.3)',
        'display:flex','align-items:center','gap:12px',
        'font-size:14px','font-weight:600','white-space:nowrap'
      ].join(';');
      const renewBtn = document.createElement('button');
      renewBtn.textContent = '续期 10 分钟';
      renewBtn.style.cssText = 'background:#fff;color:#b45309;border:none;padding:4px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px';
      renewBtn.onclick = () => {
        if (typeof saveAdminSession === 'function') saveAdminSession();
        clearSessionTimers();
        scheduleSessionTimers();
        const b = document.getElementById('admin-session-warn-banner');
        if (b) b.remove();
      };
      banner.appendChild(document.createTextNode(''));
      banner.appendChild(renewBtn);
      document.body.appendChild(banner);
    }
    banner.firstChild.textContent = `⚠️ 管理员会话将在 ${remainingSec} 秒后到期  `;
  };

  const scheduleSessionTimers = () => {
    clearSessionTimers();
    try {
      const s = JSON.parse(localStorage.getItem('admin_session'));
      if (!s) return;
      const elapsed = Date.now() - s.timestamp;
      const ADMIN_SESSION_DURATION = 10 * 60 * 1000;
      const remaining = ADMIN_SESSION_DURATION - elapsed;
      if (remaining <= 0) return;

      const warnAt = remaining - SESSION_WARN_BEFORE_MS;
      if (warnAt > 0) {
        _sessionWarnTimer = setTimeout(() => {
          // 开始倒计时显示
          let secs = Math.round(SESSION_WARN_BEFORE_MS / 1000);
          showSessionWarnBanner(secs);
          const countdownInterval = setInterval(() => {
            secs--;
            if (secs > 0) {
              showSessionWarnBanner(secs);
            } else {
              clearInterval(countdownInterval);
            }
          }, 1000);
        }, warnAt);
      } else {
        // 已在提醒窗口内，直接开始倒计时
        let secs = Math.round(remaining / 1000);
        showSessionWarnBanner(secs);
        const countdownInterval = setInterval(() => {
          secs--;
          if (secs > 0) showSessionWarnBanner(secs);
          else clearInterval(countdownInterval);
        }, 1000);
      }

      _sessionExpireTimer = setTimeout(() => {
        clearSessionTimers();
        if (typeof clearAdminSession === 'function') clearAdminSession();
        if (typeof stopAdminPoll === 'function') stopAdminPoll();
        state.adminAuthed = false;
        renderApp();
        // 友好提示
        const notice = document.createElement('div');
        notice.style.cssText = [
          'position:fixed','top:12px','left:50%','transform:translateX(-50%)',
          'z-index:9999','background:#1e293b','color:#fff',
          'padding:12px 24px','border-radius:12px',
          'box-shadow:0 4px 16px rgba(0,0,0,.35)',
          'font-size:14px','font-weight:600'
        ].join(';');
        notice.textContent = '⏱ 管理员会话已到期，请重新登录';
        document.body.appendChild(notice);
        setTimeout(() => notice.remove(), 4000);
      }, remaining);
    } catch(e) { /* storage 异常则静默 */ }
  };

  // 启动轮询（登录后调用）
  const startAdminPoll = () => {
    if (_adminPollTimer) return;
    _adminPollTimer = setInterval(() => {
      if (typeof fetchAdminOrders === 'function') fetchAdminOrders();
    }, POLL_INTERVAL_MS);
    scheduleSessionTimers(); // 同时启动到期提醒
  };

  // 停止轮询（退出登录时调用）
  const stopAdminPoll = () => {
    if (_adminPollTimer) { clearInterval(_adminPollTimer); _adminPollTimer = null; }
    _lastPendingCount = -1;
    stopTitleFlash();
    clearSessionTimers(); // 同时清除到期提醒
  };

  // 用户点击页面或切回 tab 时停止闪烁
  document.addEventListener('click', () => { if (_titleFlashTimer) stopTitleFlash(); }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && _titleFlashTimer) stopTitleFlash();
  });

  // Two clients: anon for user ops, service for admin ops
  const supabaseAnon = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const supabaseAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);

  document.addEventListener('DOMContentLoaded', () => {
    const state = {
      cart: [],
      currentTab: 'ChatGPT',
      view: 'shop',
      quantities: {},
      checkoutStep: 1,
      paymentMethod: 'wechat',
      lastOrderId: null,
      lastContactInfo: { type: '微信', contact: '' },
      adminTab: 'pending',
      adminAuthed: false,
      adminClickCount: 0,
      adminClickTimer: null,
      showCheckoutModal: false,
      showShipModal: false,
      shipOrderId: null,
      paymentReady: false,
      paymentTimeLeft: 0,
      submittingOrder: false,
      products: [],
      tabs: [],
      adminSearch: '',
      expandedOrders: {},
      // Cloud state
      cloudOrders: [],          // admin sees all orders from cloud
      userOrderIds: [],         // user's own order IDs (stored locally)
      userOrders: [],           // user's orders fetched from cloud
      loadingOrders: false,
      loadingAdminOrders: false,
      syncError: null
    };

    // ── XSS Protection ──────────────────────────────────────────────
    const escapeHTML = (str) => String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');

    const statusStyles = {
        '待确认': 'bg-error-container text-on-error-container',
        '待发货': 'bg-surface-variant text-on-surface-variant',
        '已发货': 'bg-primary-container text-on-primary-container',
        '已退款': 'bg-surface-variant text-on-surface-variant',
        '已取消': 'bg-surface-variant text-on-surface-variant'
    };

    // ── User Order ID persistence (localStorage, just IDs) ──────────
    const getUserOrderIds = () => {
      try {
        const raw = localStorage.getItem('user_order_ids');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch(e) { return []; }
    };
    const saveUserOrderId = (id) => {
      const ids = getUserOrderIds();
      if (!ids.includes(id)) ids.unshift(id);
      // Keep only last 200 IDs
      localStorage.setItem('user_order_ids', JSON.stringify(ids.slice(0, 200)));
    };

    // ── Cloud Order Helpers ─────────────────────────────────────────
    // Map DB row → app order object
    const dbRowToOrder = (row) => ({
      id: row.id,
      date: row.date,
      items: row.items,
      total: Number(row.total),
      status: row.status,
      contact: row.contact,
      contactType: row.contact_type,
      paymentMethod: row.payment_method,
      accountInfo: row.account_info || '',
      shipTime: row.ship_time || '',
      refundReason: row.refund_reason || '',
      refundTime: row.refund_time || '',
      cancelTime: row.cancel_time || ''
    });

    // Map app order → DB row
    const orderToDbRow = (order) => ({
      id: order.id,
      items: order.items,
      total: order.total,
      contact: order.contact,
      contact_type: order.contactType,
      payment_method: order.paymentMethod,
      status: order.status,
      date: order.date,
      account_info: order.accountInfo || null,
      ship_time: order.shipTime || null,
      refund_reason: order.refundReason || null,
      refund_time: order.refundTime || null,
      cancel_time: order.cancelTime || null
    });

    // ── Fetch user's own orders from cloud ──────────────────────────
    const fetchUserOrders = async () => {
      const ids = getUserOrderIds();
      if (ids.length === 0) { state.userOrders = []; render({ orders:1 }); return; }
      state.loadingOrders = true;
      render({ orders:1 });
      try {
        const { data, error } = await supabaseAnon
          .from('orders')
          .select('*')
          .in('id', ids)
          .order('date', { ascending: false });
        if (error) throw error;
        state.userOrders = (data || []).map(dbRowToOrder);
        state.syncError = null;
      } catch(e) {
        console.error('fetchUserOrders error:', e);
        state.syncError = '订单加载失败，请检查网络';
      } finally {
        state.loadingOrders = false;
        render({ orders:1 });
      }
    };

    // ── Fetch all orders for admin ──────────────────────────────────
    const fetchAdminOrders = async () => {
      state.loadingAdminOrders = true;
      render({ adminOrders:1 });
      try {
        const { data, error } = await supabaseAdmin
          .from('orders')
          .select('*')
          .order('date', { ascending: false });
        if (error) throw error;
        state.cloudOrders = (data || []).map(dbRowToOrder);
        state.syncError = null;

        // ── 方案四：检测新的待处理订单 ────────────────────────────────
        const pendingCount = state.cloudOrders.filter(o => o.status === '待确认' || o.status === '待发货').length;
        if (_lastPendingCount === -1) {
          // 首次加载：记录基准值，不触发提醒
          _lastPendingCount = pendingCount;
        } else if (pendingCount > _lastPendingCount) {
          // 有新订单进来
          playNewOrderBeep();
          startTitleFlash();
          _lastPendingCount = pendingCount;
        } else {
          // 订单数减少（已处理）或不变，更新计数
          _lastPendingCount = pendingCount;
        }

      } catch(e) {
        console.error('fetchAdminOrders error:', e);
        state.syncError = '订单加载失败';
      } finally {
        state.loadingAdminOrders = false;
        render({ adminOrders:1 });
      }
    };

    // ── Insert new order to cloud ───────────────────────────────────
    const insertOrderToCloud = async (order) => {
      const { error } = await supabaseAnon
        .from('orders')
        .insert(orderToDbRow(order));
      if (error) throw error;
    };

    // ── Update order in cloud (admin only) ─────────────────────────
    const updateOrderInCloud = async (orderId, updates) => {
      const { error } = await supabaseAdmin
        .from('orders')
        .update(updates)
        .eq('id', orderId);
      if (error) throw error;
    };

    // ── Legacy compatibility: getOrders returns user's cloud orders ──
    const getOrders = () => state.userOrders;

    // updateOrderStatus is now async and uses cloud
    const updateOrderStatus = async (orderId, newStatus, updates = {}) => {
      const dbUpdates = { status: newStatus };
      if (updates.accountInfo !== undefined) dbUpdates.account_info = updates.accountInfo;
      if (updates.shipTime !== undefined) dbUpdates.ship_time = updates.shipTime;
      if (updates.refundReason !== undefined) dbUpdates.refund_reason = updates.refundReason;
      if (updates.refundTime !== undefined) dbUpdates.refund_time = updates.refundTime;
      if (updates.cancelTime !== undefined) dbUpdates.cancel_time = updates.cancelTime;
      await updateOrderInCloud(orderId, dbUpdates);
      // Also update in cloudOrders local cache
      const idx = state.cloudOrders.findIndex(o => o.id === orderId);
      if (idx > -1) {
        state.cloudOrders[idx] = { ...state.cloudOrders[idx], status: newStatus, ...updates };
      }
      const uidx = state.userOrders.findIndex(o => o.id === orderId);
      if (uidx > -1) {
        state.userOrders[uidx] = { ...state.userOrders[uidx], status: newStatus, ...updates };
      }
    };

    // ── Products: cloud-first with localStorage fallback ────────────
    const defaultProducts = [
        { id: 'p1', category: 'ChatGPT', type: '高级账号', name: 'ChatGPT Plus', desc: '共享 / 1个月', price: 50.00, icon: 'smart_toy', stock: 10 },
        { id: 'p2', category: 'ChatGPT', type: '独享账号', name: 'ChatGPT Plus', desc: '私有 / 1个月', price: 150.00, icon: 'smart_toy', stock: 5 },
        { id: 'p3', category: 'Google', type: '全新账号', name: 'Google Voice', desc: '美国号码', price: 30.00, icon: 'call', stock: 0 }
    ];

    const dbProductToLocal = (row) => ({
      id: row.id,
      name: row.name,
      type: row.type,
      desc: row.desc,
      price: Number(row.price),
      stock: Number(row.stock),
      icon: row.icon,
      category: row.category,
      sort_order: row.sort_order
    });

    const getProducts = () => {
        try {
            const stored = localStorage.getItem('admin_products');
            if (!stored) return defaultProducts.map(p => ({...p}));
            const parsed = JSON.parse(stored);
            if (!Array.isArray(parsed)) throw new Error('Invalid products data');
            return parsed;
        } catch (e) {
            localStorage.removeItem('admin_products');
            return defaultProducts.map(p => ({...p}));
        }
    };

    const saveProducts = (products) => {
        try { localStorage.setItem('admin_products', JSON.stringify(products)); } catch (e) {}
    };

    // Fetch products from Supabase (anon can read)
    const fetchProductsFromCloud = async () => {
      try {
        const { data, error } = await supabaseAnon
          .from('products')
          .select('*')
          .order('sort_order', { ascending: true });
        if (error) throw error;
        if (data && data.length > 0) {
          const products = data.map(dbProductToLocal);
          state.products = products;
          saveProducts(products);
          return;
        }
        // Cloud empty: push local defaults up (non-blocking)
        pushProductsToCloud(state.products).catch(e => console.error('pushProductsToCloud error:', e));
      } catch(e) {
        console.error('fetchProductsFromCloud error:', e);
        // Fallback to local — state.products is already set from getProducts()
      }
    };

    const pushProductsToCloud = async (products) => {
      try {
        // Upsert all products
        const rows = products.map((p, i) => ({
          id: p.id,
          name: p.name,
          type: p.type,
          desc: p.desc,
          price: p.price,
          stock: p.stock,
          icon: p.icon,
          category: p.category,
          sort_order: p.sort_order !== undefined ? p.sort_order : i
        }));
        const { error } = await supabaseAdmin.from('products').upsert(rows);
        if (error) throw error;
      } catch(e) {
        console.error('pushProductsToCloud error:', e);
      }
    };

    const upsertProductInCloud = async (product, sortOrder) => {
      const row = {
        id: product.id,
        name: product.name,
        type: product.type,
        desc: product.desc,
        price: product.price,
        stock: product.stock,
        icon: product.icon,
        category: product.category,
        sort_order: sortOrder !== undefined ? sortOrder : 0
      };
      const { error } = await supabaseAdmin.from('products').upsert(row);
      if (error) throw error;
    };

    const deleteProductInCloud = async (productId) => {
      const { error } = await supabaseAdmin.from('products').delete().eq('id', productId);
      if (error) throw error;
    };

    // Initialize products from persistent storage and immediately save to ensure key exists
    state.products = getProducts();
    saveProducts(state.products);

    // Categories persistence (local + cloud via site_settings)
    const defaultCategories = ['ChatGPT', 'Google', 'Twitter', 'Claude', 'Apple ID', 'IP Resources'];
    const getCategories = () => {
        try {
            const stored = localStorage.getItem('admin_categories');
            if (!stored) return [...defaultCategories];
            const parsed = JSON.parse(stored);
            if (!Array.isArray(parsed) || parsed.length === 0) return [...defaultCategories];
            return parsed;
        } catch (e) {
            return [...defaultCategories];
        }
    };
    const saveCategories = (cats) => {
        try { localStorage.setItem('admin_categories', JSON.stringify(cats)); } catch(e) {}
        // Sync to cloud
        saveSiteSettingToCloud('categories', cats).catch(e => console.error('saveCategories cloud error:', e));
    };

    state.tabs = getCategories();
    state.currentTab = state.tabs[0] || '';

    // ── Site Settings: cloud-first ──────────────────────────────────
    const defaultSiteSettings = {
        announcement: { enabled: false, title: '店铺公告', content: '' },
        contacts: [
            { id: 'c1', label: 'Telegram', value: '@GlobalShop_Official' },
            { id: 'c2', label: '邮箱', value: 'help@globalshop.io' }
        ]
    };
    const getSiteSettings = () => {
        try {
            const stored = localStorage.getItem('admin_site_settings');
            if (!stored) return JSON.parse(JSON.stringify(defaultSiteSettings));
            const parsed = JSON.parse(stored);
            if (parsed.contact && !parsed.contacts) {
                const migrated = [];
                if (parsed.contact.telegram) migrated.push({ id: 'c1', label: 'Telegram', value: parsed.contact.telegram });
                if (parsed.contact.email) migrated.push({ id: 'c2', label: '邮箱', value: parsed.contact.email });
                if (parsed.contact.extra) migrated.push({ id: 'c3', label: '其他', value: parsed.contact.extra });
                parsed.contacts = migrated;
                delete parsed.contact;
            }
            return { ...JSON.parse(JSON.stringify(defaultSiteSettings)), ...parsed };
        } catch(e) { return JSON.parse(JSON.stringify(defaultSiteSettings)); }
    };

    const saveSiteSettings = (s) => {
        try { localStorage.setItem('admin_site_settings', JSON.stringify(s)); } catch(e) {}
        // Sync each key to cloud
        saveSiteSettingToCloud('announcement', s.announcement).catch(e => console.error(e));
        saveSiteSettingToCloud('contacts', s.contacts).catch(e => console.error(e));
    };

    const saveSiteSettingToCloud = async (key, value) => {
      const { error } = await supabaseAdmin
        .from('site_settings')
        .upsert({ key, value });
      if (error) console.error('saveSiteSettingToCloud error:', key, error);
    };

    const fetchSiteSettingsFromCloud = async () => {
      try {
        const { data, error } = await supabaseAnon
          .from('site_settings')
          .select('*');
        if (error) throw error;
        if (!data || data.length === 0) {
          // Push local to cloud (non-blocking, ignore errors)
          const s = getSiteSettings();
          saveSiteSettingToCloud('announcement', s.announcement).catch(() => {});
          saveSiteSettingToCloud('contacts', s.contacts).catch(() => {});
          saveSiteSettingToCloud('categories', state.tabs).catch(() => {});
          return;
        }
        // Apply cloud values
        const s = getSiteSettings();
        data.forEach(row => {
          if (row.key === 'announcement' && row.value && typeof row.value === 'object') {
            s.announcement = {
              enabled: row.value.enabled === true,
              title: row.value.title || '',
              content: row.value.content || ''
            };
          }
          if (row.key === 'contacts' && Array.isArray(row.value)) s.contacts = row.value;
          if (row.key === 'categories') {
            // Only override tabs if cloud has a non-empty valid array
            if (Array.isArray(row.value) && row.value.length > 0) {
              state.tabs = row.value;
              localStorage.setItem('admin_categories', JSON.stringify(state.tabs));
              if (!state.tabs.includes(state.currentTab)) state.currentTab = state.tabs[0] || '';
            }
          }
        });
        localStorage.setItem('admin_site_settings', JSON.stringify(s));
      } catch(e) {
        console.error('fetchSiteSettingsFromCloud error:', e);
        // On failure, keep local data intact — no action needed
      }
    };

    const renderHelpPage = () => {
        const container = document.getElementById('help-content');
        if (!container) return;
        const s = getSiteSettings();
        const ann = s.announcement;
        const contacts = Array.isArray(s.contacts) ? s.contacts : [];
        container.innerHTML = `
          ${ann.enabled && ann.content ? `
            <div class="bg-primary rounded-xl p-md mb-lg">
              <div class="flex items-center gap-2 mb-2">
                <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings:'FILL' 1;">campaign</span>
                <h3 class="font-bold text-white">${escapeHTML(ann.title || '店铺公告')}</h3>
              </div>
              <p class="text-sm text-white opacity-90 whitespace-pre-wrap">${escapeHTML(ann.content)}</p>
            </div>
          ` : ''}
          <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant mb-lg">
            <div class="flex items-center gap-2 mb-3">
              <span class="material-symbols-outlined text-primary">contact_support</span>
              <h3 class="font-bold">联系我们</h3>
            </div>
            <p class="text-sm text-on-surface-variant mb-4">需要帮助？请通过以下方式联系我们的支持团队。</p>
            ${contacts.length > 0 ? `
              <div class="space-y-2">
                ${contacts.map(c => `
                  <div class="flex items-center gap-3 p-3 bg-surface rounded-lg border border-outline-variant">
                    <span class="material-symbols-outlined text-primary text-lg">chat</span>
                    <div><p class="text-xs text-on-surface-variant">${escapeHTML(c.label)}</p><p class="font-bold text-sm whitespace-pre-wrap">${escapeHTML(c.value)}</p></div>
                  </div>`).join('')}
              </div>
            ` : '<p class="text-sm text-on-surface-variant italic">暂未设置联系方式。</p>'}
          </div>
        `;
    };

    const resetQuantities = () => {
      state.products.forEach(p => state.quantities[p.id] = 0);
    };
    resetQuantities();

    // ── Dirty-flag render system ────────────────────────────────────
    // Each flag maps to a specific render zone. Call render(flags) with only
    // the zones that actually changed to avoid full-page redraws.
    //
    // Available flags (pass as object or omit to render everything):
    //   nav        – top/bottom navigation active states
    //   tabs       – product category tab bar
    //   views      – show/hide main view sections
    //   cart       – cart badge + desktop cart bar
    //   products   – product grid (shop view)
    //   orders     – user order list
    //   adminOrders– admin order list / tabs
    //   help       – help page content
    //   checkout   – checkout modal
    //   ship       – ship modal
    //
    // render()          → renders ALL zones (safe fallback, used on init/view-switch)
    // render({cart:1})  → only updates cart badge and desktop bar

    const render = (flags) => {
        const all = !flags;
        const f = flags || {};

        if (all || f.nav)         renderNavigation();
        if (all || f.tabs)        renderTabs();
        if (all || f.views)       renderViews();
        if (all || f.cart)        updateCartBadge();

        if (all || f.products)    { if (state.view === 'shop')   renderProducts();    }
        if (all || f.orders)      { if (state.view === 'orders') renderOrders();      }
        if (all || f.adminOrders) { if (state.view === 'admin')  renderAdminOrders(); }
        if (all || f.help)        { if (state.view === 'help')   renderHelpPage();    }

        if (all || f.checkout)    renderCheckoutModal();
        if (all || f.ship)        renderShipModal();
    };

    const renderNavigation = () => {
      // 手机底部导航
      document.querySelectorAll('nav#bottom-nav button').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-white', 'rounded-xl');
        btn.classList.add('text-on-surface-variant');
      });
      const activeBtn = document.getElementById(`nav-${state.view}`);
      if(activeBtn) {
        activeBtn.classList.add('bg-primary', 'text-white', 'rounded-xl');
        activeBtn.classList.remove('text-on-surface-variant');
      }
      // 电脑端顶部导航
      ['shop','orders','help'].forEach(v => {
        const btn = document.getElementById(`desktop-nav-${v}`);
        if (!btn) return;
        if (state.view === v) {
          btn.classList.add('bg-primary', 'text-white');
          btn.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-low', 'hover:text-primary');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-low', 'hover:text-primary');
        }
      });
    };

    const renderTabs = () => {
        const tabContainer = document.getElementById('category-tabs-container');
        if(!tabContainer) return;
        
        tabContainer.innerHTML = state.tabs.map(tab => {
            const isActive = state.currentTab === tab;
            const classes = isActive 
                ? 'font-headline-sm text-headline-sm text-primary dark:text-primary-fixed border-b-2 border-primary pb-2 font-bold px-1 btn-interact'
                : 'font-body-lg text-body-lg text-on-surface-variant dark:text-outline-variant hover:text-primary pb-2 px-1 btn-interact';
            return `<button class="${classes}" onclick="switchTab('${tab}')">${tab}</button>`;
        }).join('');
    };

    const renderViews = () => {
        ['shop', 'orders', 'help', 'admin'].forEach(viewName => {
            const el = document.getElementById(`${viewName}-view`);
            if (el) {
                if (state.view === viewName) {
                    el.classList.remove('view-hidden');
                } else {
                    el.classList.add('view-hidden');
                }
            }
        });
    };

    const updateCartBadge = () => {
      const totalItems = state.cart.reduce((sum, item) => sum + item.qty, 0);
      // 手机端角标
      const badge = document.querySelector('.shopping-cart-badge');
      if (badge) {
          badge.textContent = totalItems;
          badge.classList.toggle('hidden', totalItems === 0);
      }
      // 电脑端结算栏
      const countEl = document.getElementById('desktop-cart-count');
      const totalEl = document.getElementById('desktop-cart-total');
      const checkoutBtn = document.getElementById('desktop-checkout-btn');
      const itemsWrap = document.getElementById('desktop-cart-items');
      const itemsList = document.getElementById('desktop-cart-items-list');
      if (!countEl || !totalEl || !checkoutBtn) return;
      if (totalItems === 0) {
        countEl.textContent = '购物车为空';
        totalEl.textContent = '';
        checkoutBtn.disabled = true;
        if (itemsWrap) itemsWrap.classList.add('hidden');
      } else {
        let total = 0;
        const chips = state.cart.map(item => {
          const p = state.products.find(p => p.id === item.id);
          if (!p) return '';
          const itemTotal = p.price * item.qty;
          total += itemTotal;
          return `<div class="flex items-center gap-1.5 bg-surface-container-low border border-outline-variant rounded-lg px-3 py-1.5 text-sm">
            <span class="font-bold text-on-background">${escapeHTML(p.name)}</span>
            <span class="text-on-surface-variant">×${item.qty}</span>
            <button onclick="removeFromCart('${item.id}')" class="ml-1 text-on-surface-variant hover:text-error btn-interact" title="移除">
              <span class="material-symbols-outlined text-sm leading-none">close</span>
            </button>
            <span class="font-bold text-primary ml-1">¥${itemTotal.toFixed(2)}</span>
          </div>`;
        }).join('');
        if (itemsList) itemsList.innerHTML = chips;
        if (itemsWrap) itemsWrap.classList.remove('hidden');
        countEl.textContent = `共 ${totalItems} 件`;
        totalEl.textContent = `合计 ¥${total.toFixed(2)}`;
        checkoutBtn.disabled = false;
      }
    };

    const renderProducts = () => {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      
      const filteredProducts = state.products.filter(p => p.category === state.currentTab);
      
      if(filteredProducts.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl mb-2">inventory_2</span>
            <p>此分类下暂无商品。</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredProducts.map(product => {
        const qty = state.quantities[product.id] || 0;
        const outOfStock = product.stock <= 0;
        const btnDisabled = qty === 0 || outOfStock;
        const btnClasses = btnDisabled 
            ? 'opacity-50 cursor-not-allowed grayscale' 
            : 'hover:bg-primary-container';
        
        return `
          <div class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col hover:shadow-sm transition-shadow">
            <div class="flex justify-between items-start mb-sm">
              <div>
                <span class="bg-surface-container text-on-surface-variant font-label-md text-label-md px-2 py-1 rounded-full uppercase">${product.type}</span>
                <h3 class="font-headline-sm text-headline-sm mt-2 text-on-background">${product.name}</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">${product.desc}</p>
                <p class="font-label-md text-xs mt-1 text-on-surface-variant">库存: ${product.stock}</p>
              </div>
              <span class="material-symbols-outlined text-primary-container text-3xl">${product.icon}</span>
            </div>
            <div class="flex-grow"></div>
            <div class="flex justify-between items-end mt-4">
              <div class="font-headline-md text-headline-md font-bold text-primary">¥${product.price.toFixed(2)}</div>
              <div class="flex items-center gap-2">
                <div class="flex items-center border border-outline-variant rounded-lg">
                  <button class="btn-interact px-2 py-1 text-on-surface-variant hover:text-primary" onclick="updateQty('${product.id}', -1)" ${outOfStock ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">remove</span></button>
                  <span class="font-body-md text-body-md px-2 w-4 text-center">${qty}</span>
                  <button class="btn-interact px-2 py-1 text-on-surface-variant hover:text-primary" onclick="updateQty('${product.id}', 1)" ${outOfStock ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">add</span></button>
                </div>
                <button id="add-btn-${product.id}" class="btn-interact bg-primary text-on-primary font-label-md text-label-md px-4 py-2 rounded-lg transition-colors ${btnClasses} flex items-center justify-center gap-1 min-w-[70px]" onclick="addToCart('${product.id}')" ${btnDisabled ? 'disabled' : ''}><span>${outOfStock ? '已售罄' : '加入'}</span></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    };

    const renderCart = () => {
      const cartList = document.getElementById('cart-items-list');
      if (!cartList) return;
      
      let total = 0;
      
      if(state.cart.length === 0) {
        cartList.innerHTML = '<div class="text-center text-on-surface-variant py-4">您的购物车是空的</div>';
      } else {
        cartList.innerHTML = state.cart.map(item => {
          const product = state.products.find(p => p.id === item.id);
          const itemTotal = product.price * item.qty;
          total += itemTotal;
          return `
            <div class="flex justify-between items-center py-2 border-b border-outline-variant last:border-0">
              <div>
                <div class="font-bold">${product.name}</div>
                <div class="text-body-md text-on-surface-variant">${item.qty} x ¥${product.price.toFixed(2)}</div>
              </div>
              <div class="flex items-center gap-2">
                <div class="font-bold">¥${itemTotal.toFixed(2)}</div>
                <button class="text-error hover:text-on-error-container btn-interact" onclick="removeFromCart('${item.id}')">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }
      
      const cartSubtotalEl = document.getElementById('cart-subtotal');
      const cartTotalEl = document.getElementById('cart-total');
      const paymentTotalEl = document.getElementById('payment-total');
      const payBtn = document.getElementById('pay-btn');

      if(cartSubtotalEl) cartSubtotalEl.textContent = `¥${total.toFixed(2)}`;
      if(cartTotalEl) cartTotalEl.textContent = `¥${total.toFixed(2)}`;
      if(paymentTotalEl) paymentTotalEl.textContent = `¥${total.toFixed(2)}`;
      if(payBtn) payBtn.disabled = state.cart.length === 0;
    };

    const renderOrders = () => {
      const ordersContainer = document.getElementById('orders-list');
      if(!ordersContainer) return;

      if(state.loadingOrders) {
        ordersContainer.innerHTML = `
          <div class="text-center py-10 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl mb-2 animate-spin">sync</span>
            <p>加载订单中...</p>
          </div>`;
        return;
      }

      const orders = state.userOrders;
      
      if(orders.length === 0) {
        ordersContainer.innerHTML = `
          <div class="text-center py-10 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl mb-2">receipt_long</span>
            <p>未找到活跃订单。</p>
          </div>
        `;
        return;
      }

      ordersContainer.innerHTML = orders.map(order => {
        const statusStyle = statusStyles[order.status] || 'bg-surface-variant text-on-surface-variant';
        const isExpanded = !!state.expandedOrders[order.id];
        const safeId      = escapeHTML(order.id);
        const safeStatus  = escapeHTML(order.status);
        const safeDate    = escapeHTML(order.date);
        const safeItems   = order.items.map(i => `${escapeHTML(i.qty)}x ${escapeHTML(i.name)}`).join(', ');
        return `
        <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-sm">订单号: ${safeId}</span>
            <span class="text-xs px-2 py-1 rounded-full ${statusStyle}">${safeStatus}</span>
          </div>
          <div class="text-sm text-on-surface-variant mb-2">${safeItems}</div>
          <div class="flex justify-between items-center font-bold text-sm mb-2">
            <span>总计: ¥${order.total.toFixed(2)}</span>
            <span>${safeDate}</span>
          </div>
          ${order.status === '已发货' && order.accountInfo ? `
            <div class="mt-4 p-3 bg-surface border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-highest transition-colors" onclick="toggleOrderExpand('${safeId}')">
                <p class="font-bold text-sm text-primary mb-1 flex justify-between items-center">
                  发货信息:
                  <span class="material-symbols-outlined text-sm expand-icon transition-transform ${isExpanded ? 'rotate-180' : ''}">expand_more</span>
                </p>
                <p class="account-info-content text-sm font-mono-data whitespace-pre-wrap transition-all ${isExpanded ? '' : 'line-clamp-2'}">${escapeHTML(order.accountInfo)}</p>
            </div>
          ` : ''}
          ${order.status === '已退款' && order.refundReason ? `
            <div class="mt-2 text-sm text-error">
                <p>退款原因: ${escapeHTML(order.refundReason)}</p>
                <p>退款时间: ${escapeHTML(order.refundTime)}</p>
            </div>
          ` : ''}
        </div>
      `}).join('');
    };

    window.toggleOrderExpand = (orderId) => {
      state.expandedOrders[orderId] = !state.expandedOrders[orderId];
      renderOrders();
    };

    window.copyAccountInfo = (text) => {
      navigator.clipboard.writeText(text).then(() => {
        alert('已复制');
      }).catch(() => {
        alert('复制失败');
      });
    };

    const renderAdminOrders = () => {
      const adminContainer = document.getElementById('admin-orders-list');
      const adminTabsContainer = document.getElementById('admin-tabs-container');
      
      if(adminTabsContainer) {
          adminTabsContainer.innerHTML = `
            <button class="pb-2 ${state.adminTab === 'pending' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('pending')">待处理</button>
            <button class="pb-2 ${state.adminTab === 'shipped' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('shipped')">已发货/已退款</button>
            <button class="pb-2 ${state.adminTab === 'products' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('products')">商品管理</button>
            <button class="pb-2 ${state.adminTab === 'settings' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('settings')">网站设置</button>
          `;
      }

      // Render search box above order list
      const searchBoxId = 'admin-search-box';
      let searchContainer = document.getElementById('admin-search-container');
      if (!searchContainer) {
          searchContainer = document.createElement('div');
          searchContainer.id = 'admin-search-container';
          searchContainer.className = 'mb-4';
          if (adminContainer && adminContainer.parentNode) {
              adminContainer.parentNode.insertBefore(searchContainer, adminContainer);
          }
      }

      // Products management tab
      if (state.adminTab === 'products') {
          searchContainer.innerHTML = '';
          if (!adminContainer) return;
          adminContainer.innerHTML = renderAdminProducts();
          return;
      }

      // Site settings tab
      if (state.adminTab === 'settings') {
          searchContainer.innerHTML = '';
          if (!adminContainer) return;
          adminContainer.innerHTML = renderAdminSettings();
          return;
      }

      searchContainer.innerHTML = `
        <input
          id="${searchBoxId}"
          type="text"
          class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm"
          placeholder="搜索订单号 / 联系方式"
          value="${state.adminSearch.replace(/"/g, '&quot;')}"
          oninput="window.onAdminSearch(this.value)"
        />
      `;

      if(!adminContainer) return;
      const orders = state.cloudOrders;

      if(state.loadingAdminOrders) {
        adminContainer.innerHTML = `<div class="text-center py-8 text-on-surface-variant"><span class="material-symbols-outlined text-4xl animate-spin">sync</span><p class="mt-2">从云端加载订单...</p></div>`;
        return;
      }

      const tabFiltered = orders.filter(o => 
          state.adminTab === 'pending' ? (o.status === '待确认' || o.status === '待发货') : (o.status === '已发货' || o.status === '已退款' || o.status === '已取消')
      );

      const keyword = state.adminSearch.trim();
      const filteredOrders = tabFiltered.filter(order => {
          if (!keyword) return true;
          return (
              order.id.includes(keyword) ||
              order.contact.includes(keyword)
          );
      });

      if(filteredOrders.length === 0) {
        adminContainer.innerHTML = `<p class="text-center text-on-surface-variant py-4">无相关订单。</p>`;
        return;
      }

      adminContainer.innerHTML = filteredOrders.map(order => {
        const safeId      = escapeHTML(order.id);
        const safeContact = escapeHTML(order.contact);
        const safeCtType  = escapeHTML(order.contactType);
        const safePay     = escapeHTML(order.paymentMethod);
        const safeDate    = escapeHTML(order.date);
        const safeItems   = order.items.map(i => `${escapeHTML(i.qty)}x ${escapeHTML(i.name)}`).join(', ');
        return `
        <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant flex flex-col md:flex-row justify-between items-start md:items-center transition-all mb-4">
          <div class="mb-2 md:mb-0 w-full md:w-auto">
            <p class="font-bold flex items-center gap-2">订单 #${safeId} <span class="text-xs px-2 py-1 rounded-full ${statusStyles[order.status]}">${escapeHTML(order.status)}</span></p>
            <p class="text-body-md opacity-70">${safeItems}</p>
            <p class="text-sm font-bold text-primary mt-1">金额：¥${order.total.toFixed(2)}</p>
            <p class="text-sm text-primary mt-1">联系方式 (${safeCtType}): ${safeContact}</p>
            <p class="text-sm text-on-surface-variant">付款方式: ${safePay}</p>
            <p class="text-xs text-on-surface-variant mt-1">下单时间: ${safeDate}</p>
            ${order.status === '已发货' ? `
                <p class="text-xs text-on-surface-variant">发货时间: ${escapeHTML(order.shipTime || '—')}</p>
                <div class="mt-2 text-sm bg-surface p-2 rounded border border-outline-variant">
                    <button class="font-bold text-primary flex items-center justify-between w-full" onclick="toggleAdminOrderInfo(this)">查看发货信息 <span class="material-symbols-outlined text-sm">expand_more</span></button>
                    <div class="hidden mt-2 font-mono-data whitespace-pre-wrap break-all">${escapeHTML(order.accountInfo)}</div>
                </div>
            ` : ''}
            ${order.status === '已退款' ? `
                <p class="text-xs text-on-surface-variant">退款时间: ${escapeHTML(order.refundTime || '—')}</p>
                ${order.refundReason ? `<p class="text-sm text-error mt-1">退款原因: ${escapeHTML(order.refundReason)}</p>` : ''}
            ` : ''}
            ${order.status === '已取消' ? `
                <p class="text-xs text-on-surface-variant">取消时间: ${escapeHTML(order.cancelTime || '—')}</p>
            ` : ''}
          </div>
          <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0 flex-wrap justify-end">
          ${order.status === '待确认' ? `
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none" onclick="confirmPayment('${safeId}')">确认收款</button>
                <button class="bg-error-container text-on-error-container px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="refundOrder('${safeId}')">退款</button>
                <button class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="cancelOrder('${safeId}')">取消</button>
          ` : ''}
          ${order.status === '待发货' ? `
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none" onclick="openShipModal('${safeId}')">发货</button>
                <button class="bg-error-container text-on-error-container px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="refundOrder('${safeId}')">退款</button>
                <button class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="cancelOrder('${safeId}')">取消</button>
          ` : ''}
          </div>
        </div>
      `}).join('');
    };

    window.onAdminSearch = (value) => {
      state.adminSearch = value;
      renderAdminOrders();
    };

    // Cancel order — restores stock (mirrors refund logic for consistency)
    window.cancelOrder = async (orderId) => {
        if (!confirm(`确认取消订单 ${orderId}？此操作不可撤销。`)) return;
        const btn = event.target.closest('button');
        if (btn) { btn.textContent = '处理中...'; btn.disabled = true; }
        try {
          const order = state.cloudOrders.find(o => o.id === orderId);
          const cancelTime = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
          await updateOrderStatus(orderId, '已取消', { cancelTime });

          // ── Restore stock: deducted at order time, so give it back on cancel ──
          if (order) {
              order.items.forEach(item => {
                  const product = state.products.find(p => p.id === item.id);
                  if (product) product.stock += item.qty;
              });
              saveProducts(state.products);
              await pushProductsToCloud(state.products);
          }

          render({ adminOrders:1, products:1 });
        } catch(e) {
          alert('操作失败: ' + e.message);
          if (btn) { btn.textContent = '取消'; btn.disabled = false; }
        }
    };

    // ── Product & Category Management ──────────────────────────────
    const ICON_OPTIONS = ['smart_toy','call','alternate_email','language','apple','cloud','key','lock','vpn_key','devices','storage','wifi','public','shield'];

    const renderAdminProducts = () => {
        const cats = state.tabs;
        return `
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <h3 class="font-headline-sm text-headline-sm">商品列表</h3>
            <div class="flex gap-2">
              <button class="border border-outline-variant text-on-surface-variant px-3 py-2 rounded-lg text-sm btn-interact flex items-center gap-1 hover:bg-surface-container-low" onclick="openCategoryManager()">
                <span class="material-symbols-outlined text-sm">category</span>管理分类
              </button>
              <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex items-center gap-1" onclick="openProductModal()">
                <span class="material-symbols-outlined text-sm">add</span>添加商品
              </button>
            </div>
          </div>
          ${cats.map(cat => {
            const catProducts = state.products.filter(p => p.category === cat);
            return `
              <div class="mb-6">
                <p class="font-bold text-sm text-on-surface-variant mb-2 uppercase tracking-widest">${escapeHTML(cat)}${catProducts.length === 0 ? ' <span class="text-xs font-normal normal-case">(暂无商品)</span>' : ''}</p>
                ${catProducts.length > 0 ? `<div class="space-y-3">
                  ${catProducts.map(p => `
                    <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex justify-between items-center gap-4">
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="material-symbols-outlined text-primary text-2xl flex-shrink-0">${escapeHTML(p.icon)}</span>
                        <div class="min-w-0">
                          <p class="font-bold truncate">${escapeHTML(p.name)}</p>
                          <p class="text-sm text-on-surface-variant truncate">${escapeHTML(p.type)} · ${escapeHTML(p.desc)}</p>
                          <p class="text-sm text-primary font-bold">¥${p.price.toFixed(2)} <span class="text-on-surface-variant font-normal ml-2">库存: ${escapeHTML(String(p.stock))}</span></p>
                        </div>
                      </div>
                      <div class="flex gap-2 flex-shrink-0">
                        <button class="p-2 rounded-lg border border-outline-variant btn-interact hover:bg-surface-container-high" onclick="openProductModal('${escapeHTML(p.id)}')" title="编辑">
                          <span class="material-symbols-outlined text-sm">edit</span>
                        </button>
                        <button class="p-2 rounded-lg border border-error-container bg-error-container text-on-error-container btn-interact" onclick="deleteProduct('${escapeHTML(p.id)}')" title="删除">
                          <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>` : ''}
              </div>
            `;
          }).join('')}
          ${cats.length === 0 ? '<p class="text-center text-on-surface-variant py-8">暂无分类，请先添加分类。</p>' : ''}
        `;
    };

    // ── Admin Site Settings ─────────────────────────────────────────
    const renderAdminSettings = () => {
        const s = getSiteSettings();
        const ann = s.announcement;
        const contacts = Array.isArray(s.contacts) ? s.contacts : [];
        const contactRows = contacts.map((c, i) => `
          <div class="flex gap-1.5 items-center w-full min-w-0" id="con-row-${i}">
            <input type="text" class="w-20 flex-shrink-0 rounded-lg border border-outline-variant bg-surface px-2 py-2 text-sm font-bold" placeholder="名称" value="${c.label}" id="con-label-${i}" oninput="adminSettingsChanged()"/>
            <input type="text" class="min-w-0 flex-1 rounded-lg border border-outline-variant bg-surface px-2 py-2 text-sm" placeholder="联系内容" value="${c.value}" id="con-value-${i}" oninput="adminSettingsChanged()"/>
            <button class="flex-shrink-0 p-2 rounded-lg bg-error-container text-on-error-container btn-interact" onclick="removeContactRow(${i})" title="删除">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>
        `).join('');

        return `
          <div class="space-y-6">
            <!-- Announcement -->
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md">
              <div class="flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-primary">campaign</span>
                <h3 class="font-bold">公告栏</h3>
              </div>
              <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-bold">显示公告</label>
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" id="ann-enabled" class="sr-only peer" ${ann.enabled ? 'checked' : ''} onchange="adminSettingsChanged()"/>
                  <div class="w-11 h-6 bg-outline-variant rounded-full peer peer-checked:bg-primary transition-colors"></div>
                  <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform peer-checked:translate-x-5"></div>
                </label>
              </div>
              <div class="mb-3">
                <label class="text-sm font-bold mb-1 block">公告标题</label>
                <input id="ann-title" type="text" maxlength="40" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm" value="${ann.title || ''}" placeholder="店铺公告" oninput="adminSettingsChanged()"/>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">公告内容</label>
                <textarea id="ann-content" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm min-h-[100px]" placeholder="输入公告内容..." oninput="adminSettingsChanged()">${ann.content || ''}</textarea>
              </div>
            </div>
            <!-- Contacts -->
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-primary">contact_support</span>
                  <h3 class="font-bold">联系方式</h3>
                </div>
                <button class="flex items-center gap-1 text-sm text-primary border border-primary px-3 py-1 rounded-lg btn-interact hover:bg-primary-container" onclick="addContactRow()">
                  <span class="material-symbols-outlined text-sm">add</span>添加
                </button>
              </div>
              <div class="space-y-3" id="contacts-list">
                ${contactRows || '<p class="text-sm text-on-surface-variant italic" id="contacts-empty">暂无联系方式，点击添加。</p>'}
              </div>
              <p class="text-xs text-on-surface-variant mt-3">左侧填名称（如 Telegram），右侧填联系内容。</p>
            </div>
            <!-- Save -->
            <div class="flex items-center gap-3">
              <button id="admin-settings-save-btn" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-bold btn-interact" onclick="saveAdminSettings()">保存设置</button>
              <span id="admin-settings-saved-tip" class="text-sm text-primary hidden flex items-center gap-1"><span class="material-symbols-outlined text-sm">check_circle</span>已保存</span>
            </div>
          </div>
        `;
    };

    window.adminSettingsChanged = () => {
        const tip = document.getElementById('admin-settings-saved-tip');
        if (tip) tip.classList.add('hidden');
    };

    window.addContactRow = () => {
        // Save current state first, then re-render with one extra blank row
        saveAdminSettings(true);
        const s = getSiteSettings();
        s.contacts.push({ id: 'c' + Date.now(), label: '', value: '' });
        saveSiteSettings(s);
        renderAdminOrders();
    };

    window.removeContactRow = (idx) => {
        saveAdminSettings(true);
        const s = getSiteSettings();
        s.contacts.splice(idx, 1);
        saveSiteSettings(s);
        renderAdminOrders();
    };

    window.saveAdminSettings = (silent = false) => {
        const s = getSiteSettings();
        const annEnabled = document.getElementById('ann-enabled');
        const annTitle = document.getElementById('ann-title');
        const annContent = document.getElementById('ann-content');

        if (annEnabled !== null) {
            s.announcement = {
                enabled: annEnabled.checked,
                title: annTitle ? annTitle.value.trim() : '',
                content: annContent ? annContent.value.trim() : ''
            };
        }

        // Collect all contact rows
        const list = document.getElementById('contacts-list');
        if (list) {
            const newContacts = [];
            let i = 0;
            while (document.getElementById(`con-label-${i}`) !== null) {
                const label = document.getElementById(`con-label-${i}`).value.trim();
                const value = document.getElementById(`con-value-${i}`).value.trim();
                if (label || value) newContacts.push({ id: s.contacts[i]?.id || 'c' + Date.now() + i, label, value });
                i++;
            }
            s.contacts = newContacts;
        }

        saveSiteSettings(s); // also syncs to cloud

        if (!silent) {
            const tip = document.getElementById('admin-settings-saved-tip');
            if (tip) { tip.classList.remove('hidden'); setTimeout(() => tip.classList.add('hidden'), 2500); }
            // 立即刷新帮助页内容
            renderHelpPage();
        }
    };

    // ── Category Manager Modal ──────────────────────────────────────
    window.openCategoryManager = () => {
        const existing = document.getElementById('cat-manager-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'cat-manager-modal';
        modal.className = 'fixed inset-0 z-[125] flex items-center justify-center p-4';
        modal.innerHTML = buildCategoryManagerHTML();
        document.body.appendChild(modal);

        // Attach touch listeners with passive:false AFTER DOM insertion
        // so preventDefault() works to block page scroll during drag
        modal.querySelectorAll('.cat-drag-item').forEach((el) => {
            const idx = parseInt(el.dataset.idx);
            el.addEventListener('touchstart', (e) => catTouchStart(e, idx), { passive: true });
            el.addEventListener('touchmove', (e) => catTouchMove(e), { passive: false });
            el.addEventListener('touchend', (e) => catTouchEnd(e, idx), { passive: true });
        });
    };

    const buildCategoryManagerHTML = () => {
        const cats = state.tabs;
        const listItems = cats.map((cat, idx) => `
          <div class="cat-drag-item flex items-center gap-2 bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2 transition-all duration-150 select-none"
               id="cat-item-${idx}"
               draggable="true"
               data-idx="${idx}"
               ondragstart="catDragStart(event,${idx})"
               ondragover="catDragOver(event,${idx})"
               ondragend="catDragEnd(event)"
               ondrop="catDrop(event,${idx})"
               style="cursor:grab;touch-action:none;">
            <span class="material-symbols-outlined text-on-surface-variant text-sm flex-shrink-0">drag_indicator</span>
            <span class="flex-1 text-sm font-bold truncate">${escapeHTML(cat)}</span>
            <button class="p-1 rounded hover:bg-surface-container-high btn-interact text-primary" onclick="editCategoryInline(${idx})" title="重命名">
              <span class="material-symbols-outlined text-sm">edit</span>
            </button>
            <button class="p-1 rounded hover:bg-error-container btn-interact text-error" onclick="deleteCategoryByIndex(${idx})" title="删除">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>
        `).join('');

        return `
          <style>
            .cat-drag-item.drag-over { outline: 2px solid #005bbf; background: #e8f0fe !important; }
            .cat-drag-item.dragging  { opacity: 0.35; }
          </style>
          <div class="absolute inset-0 modal-backdrop" onclick="closeCategoryManager()"></div>
          <div class="bg-surface w-full max-w-md rounded-2xl p-lg relative z-10 shadow-xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-headline-md text-headline-md">管理分类</h3>
              <button class="text-on-surface-variant hover:text-primary btn-interact" onclick="closeCategoryManager()">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <p class="text-xs text-on-surface-variant mb-3">拖拽左侧图标可调整分类顺序，前台展示同步更新</p>
            <div class="flex-1 overflow-y-auto space-y-2 mb-4 min-h-[100px]" id="cat-drag-list">
              ${listItems || '<p class="text-center text-on-surface-variant py-4 text-sm">暂无分类</p>'}
            </div>
            <div class="border-t border-outline-variant pt-4">
              <p class="text-sm font-bold mb-2">添加新分类</p>
              <div class="flex gap-2">
                <input id="new-cat-input" type="text" maxlength="30" placeholder="输入分类名称" class="flex-1 rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm"/>
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact font-bold" onclick="addNewCategory()">添加</button>
              </div>
            </div>
          </div>
        `;
    };

    window.closeCategoryManager = () => {
        const m = document.getElementById('cat-manager-modal');
        if (m) m.remove();
    };

    window.addNewCategory = () => {
        const input = document.getElementById('new-cat-input');
        const name = input ? input.value.trim() : '';
        if (!name) { alert('请输入分类名称'); return; }
        if (state.tabs.includes(name)) { alert('该分类已存在'); return; }
        state.tabs.push(name);
        saveCategories(state.tabs);
        render({ tabs:1, products:1 });
        openCategoryManager(); // refresh modal
    };

    window.editCategoryInline = (idx) => {
        const oldName = state.tabs[idx];
        const item = document.getElementById(`cat-item-${idx}`);
        if (!item) return;
        item.innerHTML = `
          <input id="edit-cat-${idx}" type="text" maxlength="30" class="flex-1 rounded border border-outline-variant bg-surface px-2 py-1 text-sm font-bold" value="${oldName}"/>
          <button class="p-1 rounded bg-primary text-on-primary btn-interact text-sm" onclick="saveCategoryEdit(${idx})">
            <span class="material-symbols-outlined text-sm">check</span>
          </button>
          <button class="p-1 rounded border border-outline-variant btn-interact" onclick="openCategoryManager()">
            <span class="material-symbols-outlined text-sm">close</span>
          </button>
        `;
        const inp = document.getElementById(`edit-cat-${idx}`);
        if (inp) { inp.focus(); inp.select(); }
    };

    window.saveCategoryEdit = (idx) => {
        const inp = document.getElementById(`edit-cat-${idx}`);
        const newName = inp ? inp.value.trim() : '';
        if (!newName) { alert('分类名称不能为空'); return; }
        const oldName = state.tabs[idx];
        if (newName !== oldName && state.tabs.includes(newName)) { alert('该分类名称已存在'); return; }
        // Update products that belong to old category
        state.products.forEach(p => { if (p.category === oldName) p.category = newName; });
        state.tabs[idx] = newName;
        if (state.currentTab === oldName) state.currentTab = newName;
        saveCategories(state.tabs);
        saveProducts(state.products);
        render({ tabs:1, products:1 });
        openCategoryManager();
    };

    window.deleteCategoryByIndex = (idx) => {
        const name = state.tabs[idx];
        const hasProducts = state.products.some(p => p.category === name);
        if (hasProducts) {
            if (!confirm(`分类"${name}"下有商品，删除后这些商品将失去分类（仍保留在系统中）。确认删除？`)) return;
        } else {
            if (!confirm(`确认删除分类"${name}"？`)) return;
        }
        state.tabs.splice(idx, 1);
        if (state.currentTab === name) state.currentTab = state.tabs[0] || '';
        saveCategories(state.tabs);
        render({ tabs:1, products:1 });
        openCategoryManager();
    };

    // ── Category drag-and-drop (desktop) ───────────────────────────
    let catDragSrcIdx = null;

    window.catDragStart = (e, idx) => {
        catDragSrcIdx = idx;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => {
            const el = document.getElementById('cat-item-' + idx);
            if (el) el.classList.add('dragging');
        }, 0);
    };

    window.catDragOver = (e, idx) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.cat-drag-item').forEach(el => el.classList.remove('drag-over'));
        if (idx !== catDragSrcIdx) {
            const el = document.getElementById('cat-item-' + idx);
            if (el) el.classList.add('drag-over');
        }
    };

    window.catDrop = (e, idx) => {
        e.preventDefault();
        if (catDragSrcIdx === null || catDragSrcIdx === idx) return;
        const moved = state.tabs.splice(catDragSrcIdx, 1)[0];
        state.tabs.splice(idx, 0, moved);
        saveCategories(state.tabs);
        render({ tabs:1, products:1 });
        openCategoryManager();
        catDragSrcIdx = null;
    };

    window.catDragEnd = () => {
        document.querySelectorAll('.cat-drag-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
        catDragSrcIdx = null;
    };

    // ── Category touch-drag (mobile) ────────────────────────────────
    // Called by openCategoryManager with passive:false so preventDefault works
    let catTouchSrcIdx = null;

    window.catTouchStart = (e, idx) => {
        catTouchSrcIdx = idx;
        const el = document.getElementById('cat-item-' + idx);
        if (el) el.classList.add('dragging');
    };

    window.catTouchMove = (e) => {
        e.preventDefault(); // blocks page scroll — only works with passive:false
        const touch = e.touches[0];
        document.querySelectorAll('.cat-drag-item').forEach(el => el.classList.remove('drag-over'));
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target) {
            const item = target.closest('.cat-drag-item');
            if (item) {
                const overIdx = parseInt(item.dataset.idx);
                if (!isNaN(overIdx) && overIdx !== catTouchSrcIdx) item.classList.add('drag-over');
            }
        }
    };

    window.catTouchEnd = (e, srcIdx) => {
        const touch = e.changedTouches[0];
        document.querySelectorAll('.cat-drag-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        let targetIdx = null;
        if (target) {
            const item = target.closest('.cat-drag-item');
            if (item) targetIdx = parseInt(item.dataset.idx);
        }
        if (targetIdx !== null && !isNaN(targetIdx) && targetIdx !== catTouchSrcIdx) {
            const moved = state.tabs.splice(catTouchSrcIdx, 1)[0];
            state.tabs.splice(targetIdx, 0, moved);
            saveCategories(state.tabs);
            render({ tabs:1 });
            openCategoryManager();
        }
        catTouchSrcIdx = null;
    };

              <button class="flex-1 py-2 bg-primary text-on-primary rounded-xl font-bold btn-interact" onclick="saveProduct('${productId || ''}')">保存</button>
