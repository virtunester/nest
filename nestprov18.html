        `;
        document.body.appendChild(modal);
    };

    window.closeProductModal = () => {
        const m = document.getElementById('product-modal');
        if (m) m.remove();
    };

    window.saveProduct = async (productId) => {
        const name = document.getElementById('pm-name').value.trim();
        const type = document.getElementById('pm-type').value.trim();
        const desc = document.getElementById('pm-desc').value.trim();
        const price = parseFloat(document.getElementById('pm-price').value);
        const stock = parseInt(document.getElementById('pm-stock').value, 10);
        const category = document.getElementById('pm-category').value;
        const icon = document.getElementById('pm-icon').value;

        if (!name || !type || !desc || isNaN(price) || isNaN(stock)) {
            alert('请填写所有字段');
            return;
        }

        const saveBtn = document.querySelector('#product-modal button[onclick*="saveProduct"]');
        if (saveBtn) { saveBtn.textContent = '保存中...'; saveBtn.disabled = true; }

        try {
          let sortOrder = 0;
          if (productId) {
              const idx = state.products.findIndex(p => p.id === productId);
              if (idx > -1) {
                  sortOrder = state.products[idx].sort_order !== undefined ? state.products[idx].sort_order : idx;
                  state.products[idx] = { ...state.products[idx], name, type, desc, price, stock, category, icon };
              }
          } else {
              sortOrder = state.products.length;
              const newProduct = { id: 'p' + Date.now(), category, type, name, desc, price, icon, stock, sort_order: sortOrder };
              state.products.push(newProduct);
              state.quantities[newProduct.id] = 0;
          }

          saveProducts(state.products);
          const product = state.products.find(p => p.id === (productId || state.products[state.products.length-1].id));
          await upsertProductInCloud(product, sortOrder);
          closeProductModal();
          render({ adminOrders:1, tabs:1, products:1 });
        } catch(e) {
          alert('保存失败: ' + e.message);
          if (saveBtn) { saveBtn.textContent = '保存'; saveBtn.disabled = false; }
        }
    };

    window.deleteProduct = async (productId) => {
        const product = state.products.find(p => p.id === productId);
        if (!product) return;
        if (!confirm(`确认删除商品"${product.name}"？此操作不可撤销。`)) return;
        try {
          state.products = state.products.filter(p => p.id !== productId);
          delete state.quantities[productId];
          saveProducts(state.products);
          await deleteProductInCloud(productId);
          render({ adminOrders:1, products:1 });
        } catch(e) {
          alert('删除失败: ' + e.message);
          // Rollback
          state.products = getProducts();
          render({ adminOrders:1, products:1 });
        }
    };

    const renderCheckoutModal = () => {
        const modal = document.getElementById('checkout-modal');
        if(!modal) return;
        
        if (state.showCheckoutModal) {
            modal.classList.remove('hidden');
            
            [1, 2, 3, 4].forEach(step => {
                const el = document.getElementById(`step-${step}`);
                if (el) {
                    if (state.checkoutStep === step) {
                        el.classList.remove('hidden');
                    } else {
                        el.classList.add('hidden');
                    }
                }
            });

            if (state.checkoutStep === 1) {
                renderCart();
            }

            if (state.checkoutStep === 2) {
                const payTabWechat = document.getElementById('pay-tab-wechat');
                const payTabAlipay = document.getElementById('pay-tab-alipay');
                const qrWechat = document.getElementById('qr-wechat');
                const qrAlipay = document.getElementById('qr-alipay');
                const paidBtn = document.getElementById('paid-btn');
                const confirmCb = document.getElementById('payment-confirm-cb');

                if(state.paymentMethod === 'wechat') {
                    payTabWechat?.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabWechat?.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    payTabAlipay?.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabAlipay?.classList.add('bg-surface-variant', 'text-on-surface-variant');
                    qrWechat?.classList.remove('hidden');
                    qrAlipay?.classList.add('hidden');
                } else {
                    payTabAlipay?.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabAlipay?.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    payTabWechat?.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabWechat?.classList.add('bg-surface-variant', 'text-on-surface-variant');
                    qrAlipay?.classList.remove('hidden');
                    qrWechat?.classList.add('hidden');
                }

                if (state.paymentTimeLeft > 0) {
                    paidBtn.textContent = `请等待 ${state.paymentTimeLeft}s`;
                    paidBtn.disabled = true;
                    confirmCb.checked = false;
                } else {
                    paidBtn.textContent = '我已支付';
                    paidBtn.disabled = !state.paymentReady;
                    confirmCb.checked = state.paymentReady;
                }
            }
            
            if (state.checkoutStep === 3) {
                const submitBtn = document.getElementById('submit-order-btn');
                if(submitBtn) {
                    if(state.submittingOrder) {
                        submitBtn.textContent = '提交中...';
                        submitBtn.disabled = true;
                    } else {
                        submitBtn.textContent = '提交订单';
                        submitBtn.disabled = false;
                    }
                }
            }

            if (state.checkoutStep === 4) {
                const idEl = document.getElementById('success-order-id');
                const contactEl = document.getElementById('success-contact');
                if(idEl) idEl.textContent = state.lastOrderId;
                if(contactEl) contactEl.textContent = `${state.lastContactInfo.type}: ${state.lastContactInfo.contact}`;
            }

        } else {
            modal.classList.add('hidden');
        }
    };

    const renderShipModal = () => {
        const modal = document.getElementById('ship-modal');
        if(!modal) return;
        
        if (state.showShipModal) {
            modal.classList.remove('hidden');
        } else {
            modal.classList.add('hidden');
        }
    };


    // Actions
    window.switchView = async (viewName) => {
      // Admin view requires authentication
      if(viewName === 'admin' && !state.adminAuthed) {
        showAdminLoginModal();
        return;
      }
      state.view = viewName;
      // View switch: update nav, views visibility, and the newly-active view content
      render({ nav:1, views:1, products:1, orders:1, adminOrders:1, help:1, cart:1 });
      if (viewName === 'orders') {
        fetchUserOrders();
      }
      if (viewName === 'admin') {
        fetchAdminOrders();
      }
    };

    window.switchTab = (tabName) => {
      state.currentTab = tabName;
      render({ tabs:1, products:1 });
    };

    window.switchAdminTab = (tabName) => {
      state.adminTab = tabName;
      render({ adminOrders:1 });
    };

    window.updateQty = (id, delta) => {
      state.quantities[id] = Math.max(0, (state.quantities[id] || 0) + delta);
      const product = state.products.find(p => p.id === id);
      if (product && state.quantities[id] > product.stock) {
          state.quantities[id] = product.stock;
      }
      render({ products:1 });
    };

    window.addToCart = (id) => {
      const qty = state.quantities[id] || 0;
      const product = state.products.find(p => p.id === id);
      
      if(qty > 0 && product) {
        if(qty > product.stock) {
            alert('库存不足');
            return;
        }

        const existingItem = state.cart.find(item => item.id === id);
        const currentCartQty = existingItem ? existingItem.qty : 0;
        
        if (currentCartQty + qty > product.stock) {
            alert('购物车总数量超出库存');
            return;
        }

        if(existingItem) {
          existingItem.qty += qty;
        } else {
          state.cart.push({ id, qty });
        }
        state.quantities[id] = 0;
        
        const btn = document.getElementById(`add-btn-${id}`);
        if(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
            btn.classList.add('bg-secondary');
            setTimeout(() => {
              const latestBtn = document.getElementById(`add-btn-${id}`);
              if(!latestBtn) return;
              latestBtn.innerHTML = originalHTML;
              latestBtn.classList.remove('bg-secondary');
            }, 1000);
        }
        
        render({ cart:1, products:1 });
      }
    };

    window.removeFromCart = (id) => {
        state.cart = state.cart.filter(item => item.id !== id);
        render({ cart:1, checkout:1 });
    };

    window.toggleCheckoutModal = (show) => {
      // Always clear any running payment timer first to prevent leaks
      if(window.paymentTimer) {
          clearInterval(window.paymentTimer);
          window.paymentTimer = null;
      }
      state.showCheckoutModal = show;
      if (show) {
          setCheckoutStep(1);
      } else {
          render({ checkout:1 });
      }
    };

    window.setCheckoutStep = (step) => {
      state.checkoutStep = step;
      
      if(step === 2) {
          if(window.paymentTimer) {
              clearInterval(window.paymentTimer);
              window.paymentTimer = null;
          }
          state.paymentReady = false;
          state.paymentTimeLeft = 5;
          window.paymentTimer = setInterval(() => {
              state.paymentTimeLeft--;
              if(state.paymentTimeLeft <= 0) {
                  clearInterval(window.paymentTimer);
                  window.paymentTimer = null;
              }
              render({ checkout:1 });
          }, 1000);
      }

      // Defense: validate all step elements exist before touching classList
      [1, 2, 3, 4].forEach(s => {
          const el = document.getElementById(`step-${s}`);
          if (!el) return;
          if (s === step) {
              el.classList.remove('hidden');
          } else {
              el.classList.add('hidden');
          }
      });

      render({ checkout:1 });
    };

    window.togglePaymentReady = (checked) => {

        render({ checkout:1 });
    };

    window.switchPaymentMethod = (method) => {
      state.paymentMethod = method;
      render({ checkout:1 });
    };

    window.submitOrder = async () => {
      if(state.cart.length === 0) {
          alert('购物车为空');
          return;
      }
      if(state.submittingOrder) return;
      
      const contactInput = document.getElementById('contact-input').value;
      const contactType = document.getElementById('contact-type').value;
      
      if(contactInput.length < 5) {
        alert('请输入至少5个字符的联系方式');
        return;
      }

      state.submittingOrder = true;
      render({ checkout:1 });

      try {
          let total = 0;
          const orderItems = state.cart.map(item => {
            const product = state.products.find(p => p.id === item.id);
            total += product.price * item.qty;
            return {
                id: item.id,
                qty: item.qty,
                name: product.name,
                type: product.type
            };
          });

          // ── Pre-submit stock check (re-validate against current state) ──
          for (const item of state.cart) {
              const product = state.products.find(p => p.id === item.id);
              if (!product || product.stock < item.qty) {
                  alert(`库存不足，无法下单：${product ? product.name : item.id}（剩余 ${product ? product.stock : 0}，需要 ${item.qty}）`);
                  state.submittingOrder = false;
                  render({ checkout:1 });
                  return;
              }
          }

          const orderId = 'ORD-' + Date.now().toString(36).toUpperCase();
          state.lastOrderId = orderId;
          state.lastContactInfo = { type: contactType, contact: contactInput };

          const order = {
            id: orderId,
            date: new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
            items: orderItems,
            total: total,
            status: '待确认',
            contact: contactInput,
            contactType: contactType,
            paymentMethod: state.paymentMethod === 'wechat' ? '微信' : '支付宝'
          };

          // Save to Supabase cloud
          await insertOrderToCloud(order);

          // ── Telegram 新订单通知（方案一：前端直发，失败静默）──────────
          const itemLines = orderItems.map(i => `  • ${i.name} × ${i.qty}`).join('\n');
          await sendTelegramNotify(
            `🛒 <b>新订单</b>\n` +
            `订单号: <code>${orderId}</code>\n` +
            `商品:\n${itemLines}\n` +
            `金额: ¥${total.toFixed(2)}\n` +
            `付款: ${order.paymentMethod}\n` +
            `联系 (${contactType}): ${contactInput}\n` +
            `时间: ${order.date}`
          );

          // ── Immediately deduct stock to prevent overselling ──
          for (const item of state.cart) {
              const product = state.products.find(p => p.id === item.id);
              if (product) product.stock = Math.max(0, product.stock - item.qty);
          }
          saveProducts(state.products);
          await pushProductsToCloud(state.products);

          // Remember this order ID locally so user can see it
          saveUserOrderId(orderId);
          // Add to local userOrders cache
          state.userOrders.unshift(order);
          
          state.cart = [];
          resetQuantities();
          state.checkoutStep = 4;
          
      } catch (e) {
          console.error("Order submission failed", e);
          alert("订单提交失败，请检查网络后重试。");
      } finally {
          state.submittingOrder = false;
          render({ checkout:1, cart:1, products:1 });
      }
    };

    window.finishCheckout = () => {
      state.showCheckoutModal = false;
      if(window.paymentTimer) {
          clearInterval(window.paymentTimer);
          window.paymentTimer = null;
      }
      state.view = 'orders';
      render({ nav:1, views:1, orders:1, checkout:1 });

    window.refreshOrders = () => fetchUserOrders();
    window.refreshAdminOrders = () => fetchAdminOrders();

    // Admin Actions
    window.confirmPayment = async (orderId) => {

        if (btn) { btn.textContent = '处理中...'; btn.disabled = true; }
        try {
          await updateOrderStatus(orderId, '待发货');
          render({ adminOrders:1 });
        } catch(e) {
          alert('操作失败: ' + e.message);
          if (btn) { btn.textContent = '确认收款'; btn.disabled = false; }
        }
    };

    window.openShipModal = (orderId) => {
        state.shipOrderId = orderId;
        state.showShipModal = true;
        const infoEl = document.getElementById('ship-account-info');
        if(infoEl) infoEl.value = '';
        render({ ship:1 });

    window.closeShipModal = () => {
        state.showShipModal = false;
        state.shipOrderId = null;
        render({ ship:1 });
    };

    window.confirmShipment = async () => {
        const accountInfo = document.getElementById('ship-account-info').value;
        if(!accountInfo) {
            alert('请输入账号信息');
            return;
        }
        
        const order = state.cloudOrders.find(o => o.id === state.shipOrderId);
        if(!order) {
            alert('订单不存在');
            return;
        }
        
        // ── Inventory pre-check (safety guard; stock was already deducted at order time) ──
        // This catches edge cases such as admin manually editing stock between order and shipment.
        for (const item of order.items) {
            const product = state.products.find(p => p.id === item.id);
            if (!product) {
                alert(`商品不存在，无法发货 (${item.name})，请检查商品配置`);
                return;
            }
        }

        const confirmBtn = document.getElementById('ship-modal') && document.querySelector('#ship-modal button[onclick="confirmShipment()"]');
        if (confirmBtn) { confirmBtn.textContent = '发货中...'; confirmBtn.disabled = true; }
        
        try {
          const shipTime = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
          await updateOrderStatus(state.shipOrderId, '已发货', { accountInfo, shipTime });
          // Note: stock was already deducted at order submission time; no deduction needed here.
          
          state.showShipModal = false;
          state.shipOrderId = null;
          render({ ship:1, adminOrders:1 });
        } catch(e) {
          alert('发货失败: ' + e.message);
          if (confirmBtn) { confirmBtn.textContent = '确认发货'; confirmBtn.disabled = false; }
        }
    };

    window.refundOrder = (orderId) => {
        // Show custom refund reason modal instead of native prompt
        const existing = document.getElementById('refund-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'refund-modal';
        modal.className = 'fixed inset-0 z-[150] flex items-center justify-center p-4';
        modal.innerHTML = `
          <div class="absolute inset-0 modal-backdrop" onclick="document.getElementById('refund-modal').remove()"></div>
          <div class="bg-surface w-full max-w-sm rounded-2xl p-lg relative z-10 shadow-xl">
            <h3 class="font-headline-md text-headline-md mb-1">退款确认</h3>
            <p class="text-sm text-on-surface-variant mb-4">订单 #${escapeHTML(orderId)}</p>
            <div class="mb-4">
              <label class="text-sm font-bold mb-1 block">退款原因</label>
              <textarea id="refund-reason-input" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm min-h-[80px]" placeholder="请输入退款原因（可选）"></textarea>
            </div>
            <div class="flex gap-3">
              <button class="flex-1 py-2 border border-outline-variant rounded-xl font-bold btn-interact"
                onclick="document.getElementById('refund-modal').remove()">取消</button>
              <button class="flex-1 py-2 bg-error text-on-error rounded-xl font-bold btn-interact"
                onclick="confirmRefund('${escapeHTML(orderId)}')">确认退款</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        setTimeout(() => modal.querySelector('#refund-reason-input').focus(), 50);
    };

    window.confirmRefund = async (orderId) => {
        const reasonEl = document.getElementById('refund-reason-input');
        const reason = reasonEl ? reasonEl.value.trim() : '';
        const modal = document.getElementById('refund-modal');
        
        const confirmBtn = modal && modal.querySelector('button[onclick*="confirmRefund"]');
        if (confirmBtn) { confirmBtn.textContent = '处理中...'; confirmBtn.disabled = true; }

        try {
          const order = state.cloudOrders.find(o => o.id === orderId);
          if (!order) { alert('订单不存在'); return; }
          if (order.status === '已退款') { alert('订单已退款'); return; }

          const previousStatus = order.status;
          const refundTime = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

          await updateOrderStatus(orderId, '已退款', {
            refundReason: reason || '未提供原因',
            refundTime
          });

          if (previousStatus === '已发货') {
              order.items.forEach(item => {
                  const product = state.products.find(p => p.id === item.id);
                  if(product) product.stock += item.qty;
              });
              saveProducts(state.products);
              await pushProductsToCloud(state.products);
          }

          if (modal) modal.remove();
          render({ adminOrders:1, products:1 });
        } catch(e) {
          alert('退款失败: ' + e.message);
          if (confirmBtn) { confirmBtn.textContent = '确认退款'; confirmBtn.disabled = false; }
        }
    };

    window.logoutAdmin = () => {
      state.adminAuthed = false;
      clearAdminSession();
      stopAdminPoll(); // 方案四：停止轮询和提醒
      state.view = 'shop';
      render({ nav:1, views:1, products:1, cart:1 });
    };

    window.toggleAdminOrderInfo = (el) => {
        const content = el.nextElementSibling;
        content.classList.toggle('hidden');
    };

    // ── Security: PBKDF2 password verification ─────────────────────
    // Salt is fixed and embedded — makes rainbow tables useless for this app
    const ADMIN_SALT = 'globalshop_s@lt_2025_x9z';
    // PBKDF2 hash of the admin password (iterations=150000, SHA-256)
    // To update: open browser console and run generateAdminHash('yourNewPassword'), copy the result here
    const ADMIN_HASH = '44f60c4577d89d3e37a29911ffe10279d600aca9bcb94ad0459b3cac68a0f3ba';

    async function pbkdf2Hash(password, salt, iterations = 150000) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
        );
        const bits = await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: enc.encode(salt), iterations, hash: 'SHA-256' },
            keyMaterial, 256
        );
        return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Expose helper so admin can generate a new hash in the browser console:
    // generateAdminHash('myNewPassword') → copy the result into ADMIN_HASH above
    window.generateAdminHash = async (pw) => {
        const h = await pbkdf2Hash(pw, ADMIN_SALT);
        console.log('%c Admin PBKDF2 Hash:', 'color:green;font-weight:bold', h);
        return h;
    };

    // ── Login lockout ───────────────────────────────────────────────
    const LOCKOUT_KEY  = 'admin_lockout';
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_MS   = 5 * 60 * 1000; // 5 minutes

    const getLockout = () => {
        try { return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || { attempts: 0, until: 0 }; }
        catch(e) { return { attempts: 0, until: 0 }; }
    };
    const saveLockout = (data) => localStorage.setItem(LOCKOUT_KEY, JSON.stringify(data));
    const isLockedOut = () => {
        const { until } = getLockout();
        return Date.now() < until;
    };
    const recordFailedAttempt = () => {
        const d = getLockout();
        d.attempts++;
        if (d.attempts >= MAX_ATTEMPTS) {
            d.until = Date.now() + LOCKOUT_MS;
            d.attempts = 0;
        }
        saveLockout(d);
    };
    const clearLockout = () => saveLockout({ attempts: 0, until: 0 });

    // ── Admin Session ───────────────────────────────────────────────
    const ADMIN_SESSION_KEY      = 'admin_session';
    const ADMIN_SESSION_DURATION = 10 * 60 * 1000; // 10 minutes

    const isAdminSessionValid = () => {
        try {
            const s = JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY));
            if (!s) return false;
            // Bind session to userAgent to prevent copy-paste attacks
            return (Date.now() - s.timestamp) < ADMIN_SESSION_DURATION
                && s.ua === navigator.userAgent;
        } catch(e) { return false; }
    };
    const saveAdminSession = () => {
        localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({
            timestamp: Date.now(),
            ua: navigator.userAgent
        }));
    };
    const clearAdminSession = () => localStorage.removeItem(ADMIN_SESSION_KEY);

    // Restore session on page load
    if (isAdminSessionValid()) {
      state.adminAuthed = true;
      startAdminPoll(); // 方案四：session 有效则自动启动轮询
    }

    // ── Admin login modal (replaces native prompt) ──────────────────
    function showAdminLoginModal() {
        const existing = document.getElementById('admin-login-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'admin-login-modal';
        modal.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4';
        modal.innerHTML = `
          <div class="absolute inset-0 modal-backdrop"></div>
          <div class="bg-surface w-full max-w-xs rounded-2xl p-lg relative z-10 shadow-xl">
            <h3 class="font-headline-md text-headline-md mb-4 text-center">管理员登录</h3>
            <div id="admin-login-error" class="hidden mb-3 text-sm text-error bg-error-container rounded-lg px-3 py-2"></div>
            <div class="mb-4">
              <label class="text-sm font-bold mb-1 block">密码</label>
              <input id="admin-login-pw" type="password" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-3"
                placeholder="请输入管理员密码" autocomplete="current-password"/>
            </div>
            <div class="flex gap-3">
              <button class="flex-1 py-2 border border-outline-variant rounded-xl font-bold btn-interact"
                onclick="document.getElementById('admin-login-modal').remove()">取消</button>
              <button id="admin-login-btn" class="flex-1 py-2 bg-primary text-on-primary rounded-xl font-bold btn-interact"
                onclick="submitAdminLogin()">登录</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        // Allow Enter key to submit
        modal.querySelector('#admin-login-pw').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitAdminLogin();
        });
        setTimeout(() => modal.querySelector('#admin-login-pw').focus(), 50);
    }

    window.submitAdminLogin = async () => {
        if (isLockedOut()) {
            const { until } = getLockout();
            const mins = Math.ceil((until - Date.now()) / 60000);
            document.getElementById('admin-login-error').textContent = `登录已锁定，请 ${mins} 分钟后重试`;
            document.getElementById('admin-login-error').classList.remove('hidden');
            return;
        }

        const pw = document.getElementById('admin-login-pw').value;
        if (!pw) return;

        const btn = document.getElementById('admin-login-btn');
        btn.textContent = '验证中...';
        btn.disabled = true;

        const hash = await pbkdf2Hash(pw, ADMIN_SALT);

        if (hash === ADMIN_HASH) {
            clearLockout();
            saveAdminSession();
            state.adminAuthed = true;
            document.getElementById('admin-login-modal').remove();
            state.view = 'admin';
            render({ nav:1, views:1, adminOrders:1 });
            fetchAdminOrders();
            startAdminPoll(); // 方案四：启动轮询
        } else {
            recordFailedAttempt();
            const d = getLockout();
            const remaining = MAX_ATTEMPTS - d.attempts;
            const errEl = document.getElementById('admin-login-error');
            if (isLockedOut()) {
                errEl.textContent = `密码错误次数过多，已锁定 5 分钟`;
            } else {
                errEl.textContent = `密码错误，还剩 ${remaining} 次机会`;
            }
            errEl.classList.remove('hidden');
            btn.textContent = '登录';
            btn.disabled = false;
            document.getElementById('admin-login-pw').value = '';
            document.getElementById('admin-login-pw').focus();
        }
    };

    // ── Hidden Gesture Logic ────────────────────────────────────────
    const triggerEl = document.getElementById('admin-secret-trigger');
    if(triggerEl) {
        triggerEl.addEventListener('click', () => {
            state.adminClickCount++;
            clearTimeout(state.adminClickTimer);
            state.adminClickTimer = setTimeout(() => { state.adminClickCount = 0; }, 3000);

            if (state.adminClickCount >= 5) {
                state.adminClickCount = 0;
                if (navigator.vibrate) navigator.vibrate(80);

                if (isAdminSessionValid()) {
                    state.adminAuthed = true;
                    state.view = 'admin';
                    render();
                    fetchAdminOrders();
                    return;
                }
                showAdminLoginModal();
            }
        });
    }

    // Initialize — boot from cloud, then render
    (async () => {
      render(); // show skeleton immediately with local data
      // Restore admin session
      if (isAdminSessionValid()) {
        state.adminAuthed = true;
      }
      // Load site settings + categories from cloud (non-blocking on failure)
      try { await fetchSiteSettingsFromCloud(); } catch(e) { console.error('init: site settings failed', e); }
      // Load products from cloud (non-blocking on failure)
      try { await fetchProductsFromCloud(); } catch(e) { console.error('init: products failed', e); }
      // Ensure tabs/currentTab are valid after cloud sync
      if (!state.tabs || state.tabs.length === 0) {
        state.tabs = getCategories();
      }
      // Always default to first tab after cloud sync
      state.currentTab = state.tabs[0] || '';
      resetQuantities();
      render();
      // If user has order IDs saved locally, fetch them
      const ids = getUserOrderIds();
      if (ids.length > 0) {
        try { await fetchUserOrders(); } catch(e) { console.error('init: user orders failed', e); }
      }
      // If already on admin view (session restored), load admin orders
      if (state.adminAuthed && state.view === 'admin') {
        try { await fetchAdminOrders(); } catch(e) { console.error('init: admin orders failed', e); }
      }
    })();

    // ── Shop swipe left/right to cycle tabs (mobile) ───────────────
    // Expose state to window so the touch handler (same closure) can always see it
    window._shopState = state;

  }); // end DOMContentLoaded

  // Swipe handler runs AFTER DOMContentLoaded so HTML is ready
  // Uses window._shopState to access live state from the closure above
  window.addEventListener('load', () => {
    let _sx = 0, _sy = 0, _dir = null;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      _sx = e.touches[0].clientX;
      _sy = e.touches[0].clientY;
      _dir = null;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (_dir) return;
      const dx = e.touches[0].clientX - _sx;
      const dy = e.touches[0].clientY - _sy;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      _dir = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
    }, { passive: true });

    const ADMIN_TABS = ['pending', 'shipped', 'products', 'settings'];

    document.addEventListener('touchend', (e) => {
      if (_dir !== 'h') return;
      _dir = null;

      const st = window._shopState;
      if (!st) return;

      const dx = e.changedTouches[0].clientX - _sx;
      if (Math.abs(dx) < 40) return;

      // ── 商店页：切换商品分类 tab ──
      if (st.view === 'shop' && st.tabs && st.tabs.length >= 2) {
        const tabBar = document.getElementById('category-tabs-container');
        if (tabBar) {
          const r = tabBar.getBoundingClientRect();
          if (_sy >= r.top && _sy <= r.bottom + 4) return;
        }
        const curIdx = st.tabs.indexOf(st.currentTab);
        const nextIdx = dx < 0
          ? (curIdx + 1) % st.tabs.length
          : (curIdx - 1 + st.tabs.length) % st.tabs.length;
        window.switchTab(st.tabs[nextIdx]);
        setTimeout(() => {
          const btns = document.querySelectorAll('#category-tabs-container button');
          if (btns[nextIdx]) btns[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }, 30);
        return;
      }

      // ── 管理员页：切换管理 tab ──
      if (st.view === 'admin') {
        const curIdx = ADMIN_TABS.indexOf(st.adminTab);
        const nextIdx = dx < 0
          ? (curIdx + 1) % ADMIN_TABS.length
          : (curIdx - 1 + ADMIN_TABS.length) % ADMIN_TABS.length;
        window.switchAdminTab(ADMIN_TABS[nextIdx]);
      }
    }, { passive: true });
  });
</script>
</head>
