<style>
  body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  body { min-height: max(884px, 100dvh); }
  .view-hidden { display: none !important; }
  .tab-active { color: var(--tw-primary); border-bottom-width: 2px; border-color: var(--tw-primary); font-weight: 700; }

  /* Loading overlay */
  #global-loading {
    position: fixed; inset: 0; z-index: 9999;

  #global-loading.hidden { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

<script>
  // ═══════════════════════════════════════════════════════════════════
  // SUPABASE CONFIG
  // ═══════════════════════════════════════════════════════════════════
  const SUPABASE_URL  = 'https://cgtrlucacjrbtazidixn.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDI1NDcsImV4cCI6MjA5NDExODU0N30.PX_IncuHZfsLl23OHt00XXyswycFtkmcUI3Su7BWkWY';
  const SUPABASE_SVC  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndHJsdWNhY2pyYnRhemlkaXhuIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODU0MjU0NywiZXhwIjoyMDk0MTE4NTQ3fQ.yVOLWHtAz4jyBwMWfmaCSfjbqBX7o8ibTeUtdwd1B4Q';

  // ── Low-level Supabase REST helpers ─────────────────────────────
  async function sbFetch(path, opts = {}, useServiceRole = false) {
    const key = useServiceRole ? SUPABASE_SVC : SUPABASE_ANON;
    const headers = {
      'Content-Type': 'application/json',
      'apikey': key,
      'Authorization': `Bearer ${key}`,
      'Prefer': opts.prefer || '',
      ...opts.headers
    };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  // ── Supabase API ─────────────────────────────────────────────────
  const SB = {
    // Products
    async getProducts() {
      return await sbFetch('products?select=*&order=sort_order.asc,id.asc');
    },
    async upsertProduct(product, isService = false) {
      return await sbFetch('products', {
        method: 'POST',
        prefer: 'resolution=merge-duplicates,return=representation',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
        body: product
      }, isService);
    },
    async deleteProduct(id) {
      return await sbFetch(`products?id=eq.${encodeURIComponent(id)}`, {
        method: 'DELETE'
      }, true);
    },
    async updateProduct(id, updates) {
      return await sbFetch(`products?id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=representation' },
        body: updates
      }, true);
    },

    // Orders
    async insertOrder(order) {
      return await sbFetch('orders', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: order
      }, false); // anon can insert
    },
    async getOrderById(id) {
      const rows = await sbFetch(`orders?id=eq.${encodeURIComponent(id)}&select=*`);
      return rows && rows[0] ? rows[0] : null;
    },
    async getAllOrders() {
      return await sbFetch('orders?select=*&order=date.desc', {}, true);
    },
    async updateOrder(id, updates) {
      return await sbFetch(`orders?id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=representation' },
        body: updates
      }, true);
    },

    // Site settings
    async getSiteSettings() {
      const rows = await sbFetch('site_settings?select=*');
      const map = {};
      (rows || []).forEach(r => { map[r.key] = r.value; });
      return map;
    },
    async upsertSiteSetting(key, value) {
      return await sbFetch('site_settings', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
        body: { key, value }
      }, true);
    },

    // Categories (stored as site_setting key='categories')
    async getCategories() {
      const rows = await sbFetch('site_settings?key=eq.categories&select=value');
      if (rows && rows[0]) return rows[0].value;
      return null;
    },
    async saveCategories(cats) {
      return await this.upsertSiteSetting('categories', cats);
    }
  };

  // ── Local order ID cache (for user's "my orders" view) ──────────
  const LOCAL_ORDER_IDS_KEY = 'user_order_ids';
  const getLocalOrderIds = () => {
    try {
      const v = localStorage.getItem(LOCAL_ORDER_IDS_KEY);
      if (!v) return [];
      const parsed = JSON.parse(v);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  };
  const addLocalOrderId = (id) => {
    const ids = getLocalOrderIds();
    if (!ids.includes(id)) { ids.unshift(id); }
    // Keep last 50
    try { localStorage.setItem(LOCAL_ORDER_IDS_KEY, JSON.stringify(ids.slice(0, 50))); } catch {}
  };

  // ─────────────────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', async () => {
    const state = {
      cart: [],
      currentTab: '',
      view: 'shop',
      quantities: {},
      checkoutStep: 1,
      paymentMethod: 'wechat',
      lastOrderId: null,
      lastContactInfo: { type: '微信', contact: '' },
      adminTab: 'pending',
      adminAuthed: false,
      adminClickCount: 0,
      adminClickTimer: null,
      showCheckoutModal: false,
      showShipModal: false,
      shipOrderId: null,
      paymentReady: false,
      paymentTimeLeft: 0,
      submittingOrder: false,
      products: [],
      tabs: [],
      adminSearch: '',
      expandedOrders: {},
      // Cloud data
      allOrders: [],       // admin: loaded from Supabase
      userOrders: [],      // user: loaded from Supabase by IDs
      ordersLoading: false,
      adminOrdersLoading: false,
      siteSettings: {}
    };

    // ── Global Loading Overlay ──────────────────────────────────────
    const showLoading = (msg = '加载中...') => {
      let el = document.getElementById('global-loading');
      if (!el) return;
      el.querySelector('p').textContent = msg;
      el.classList.remove('hidden');
    };
    const hideLoading = () => {
      const el = document.getElementById('global-loading');
      if (el) el.classList.add('hidden');
    };

    // ── XSS Protection ──────────────────────────────────────────────
    const escapeHTML = (str) => String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');

    const statusStyles = {
        '待确认': 'bg-error-container text-on-error-container',
        '待发货': 'bg-surface-variant text-on-surface-variant',
        '已发货': 'bg-primary-container text-on-primary-container',
        '已退款': 'bg-surface-variant text-on-surface-variant',
        '已取消': 'bg-surface-variant text-on-surface-variant'
    };

    // ── Toast Notification ──────────────────────────────────────────
    const showToast = (msg, isError = false) => {
      const existing = document.getElementById('toast-msg');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.id = 'toast-msg';
      el.className = `fixed top-20 left-1/2 -translate-x-1/2 z-[999] px-5 py-3 rounded-xl shadow-lg text-sm font-bold transition-all ${isError ? 'bg-error text-on-error' : 'bg-primary text-on-primary'}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    };

    // ── Init: Load all cloud data ───────────────────────────────────
    showLoading('正在加载商品数据...');
    try {
      // Load products
      const cloudProducts = await SB.getProducts();
      if (cloudProducts && cloudProducts.length > 0) {
        state.products = cloudProducts.map(p => ({
          id: p.id,
          category: p.category || '',
          type: p.type || '',
          name: p.name || '',
          desc: p.desc || '',
          price: parseFloat(p.price) || 0,
          icon: p.icon || 'smart_toy',
          stock: parseInt(p.stock) || 0,
          sort_order: p.sort_order || 0
        }));
      } else {
        // First run: seed default products
        state.products = [
          { id: 'p1', category: 'ChatGPT', type: '高级账号', name: 'ChatGPT Plus', desc: '共享 / 1个月', price: 50.00, icon: 'smart_toy', stock: 10, sort_order: 1 },
          { id: 'p2', category: 'ChatGPT', type: '独享账号', name: 'ChatGPT Plus', desc: '私有 / 1个月', price: 150.00, icon: 'smart_toy', stock: 5, sort_order: 2 },
          { id: 'p3', category: 'Google', type: '全新账号', name: 'Google Voice', desc: '美国号码', price: 30.00, icon: 'call', stock: 0, sort_order: 3 }
        ];
        // Seed to Supabase
        for (const p of state.products) {
          await SB.upsertProduct(p, true).catch(() => {});
        }
      }

      // Load categories from site_settings
      const cloudCats = await SB.getCategories();
      if (cloudCats && Array.isArray(cloudCats) && cloudCats.length > 0) {
        state.tabs = cloudCats;
      } else {
        // Derive from products
        const catSet = new Set(state.products.map(p => p.category).filter(Boolean));
        const defaults = ['ChatGPT', 'Google', 'Twitter', 'Claude', 'Apple ID', 'IP Resources'];
        state.tabs = defaults.filter(c => catSet.has(c) || state.products.length === 0);
        if (state.tabs.length === 0) state.tabs = [...catSet];
        await SB.saveCategories(state.tabs).catch(() => {});
      }
      if (!state.tabs.includes(state.currentTab)) state.currentTab = state.tabs[0] || '';

      // Load site settings
      const sMap = await SB.getSiteSettings();
      const annRaw = sMap['announcement'];
      const contactsRaw = sMap['contacts'];
      state.siteSettings = {
        announcement: annRaw || { enabled: false, title: '店铺公告', content: '' },
        contacts: contactsRaw || [
          { id: 'c1', label: 'Telegram', value: '@GlobalShop_Official' },
          { id: 'c2', label: '邮箱', value: 'help@globalshop.io' }
        ]
      };

    } catch (e) {
      console.error('Init failed:', e);
      showToast('云端连接失败，请刷新重试', true);
    }

    state.products.forEach(p => state.quantities[p.id] = 0);

    // Load user orders from cloud (by stored IDs)
    await loadUserOrders();

    hideLoading();

    // Restore admin session
    if (isAdminSessionValid()) state.adminAuthed = true;

    render();

    // ── User Orders (cloud, by IDs) ─────────────────────────────────
    async function loadUserOrders() {
      const ids = getLocalOrderIds();
      if (ids.length === 0) { state.userOrders = []; return; }
      try {
        state.ordersLoading = true;
        const fetched = [];
        // Fetch in parallel (max 20)
        const toFetch = ids.slice(0, 20);
        await Promise.all(toFetch.map(async id => {
          const order = await SB.getOrderById(id).catch(() => null);
          if (order) fetched.push(mapDbOrder(order));
        }));
        // Sort by date desc
        fetched.sort((a, b) => b.id.localeCompare(a.id));
        state.userOrders = fetched;
      } catch (e) {
        console.error('Load user orders failed:', e);
      } finally {
        state.ordersLoading = false;
      }
    }

    // ── Admin Orders (cloud, all) ───────────────────────────────────
    async function loadAdminOrders() {
      try {
        state.adminOrdersLoading = true;
        const rows = await SB.getAllOrders();
        state.allOrders = (rows || []).map(mapDbOrder);
      } catch (e) {
        showToast('加载订单失败: ' + e.message, true);
        state.allOrders = [];
      } finally {
        state.adminOrdersLoading = false;
      }
    }

    // Map DB row → app order object
    function mapDbOrder(row) {
      return {
        id: row.id,
        date: row.date || '',
        items: Array.isArray(row.items) ? row.items : (typeof row.items === 'string' ? JSON.parse(row.items) : []),
        total: parseFloat(row.total) || 0,
        status: row.status || '待确认',
        contact: row.contact || '',
        contactType: row.contact_type || '',
        paymentMethod: row.payment_method || '',
        accountInfo: row.account_info || '',
        shipTime: row.ship_time || '',
        refundReason: row.refund_reason || '',
        refundTime: row.refund_time || '',
        cancelTime: row.cancel_time || ''
      };
    }

    // ── Core Render Functions ───────────────────────────────────────
    const render = () => {
        renderNavigation();
        renderTabs();
        renderViews();
        updateCartBadge();
        if (state.view === 'shop')   renderProducts();
        if (state.view === 'orders') renderOrders();
        if (state.view === 'admin')  renderAdminOrders();
        if (state.view === 'help')   renderHelpPage();
        renderCheckoutModal();
        renderShipModal();
    };

    const renderNavigation = () => {
      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-white', 'rounded-xl');
        btn.classList.add('text-on-surface-variant');
      });
      const activeBtn = document.getElementById(`nav-${state.view}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-primary', 'text-white', 'rounded-xl');
        activeBtn.classList.remove('text-on-surface-variant');
      }
    };

    const renderTabs = () => {
        const tabContainer = document.getElementById('category-tabs-container');
        if (!tabContainer) return;
        tabContainer.innerHTML = state.tabs.map(tab => {
            const isActive = state.currentTab === tab;
            const classes = isActive
                ? 'font-headline-sm text-headline-sm text-primary dark:text-primary-fixed border-b-2 border-primary pb-2 font-bold px-1 btn-interact'
                : 'font-body-lg text-body-lg text-on-surface-variant dark:text-outline-variant hover:text-primary pb-2 px-1 btn-interact';
            return `<button class="${classes}" onclick="switchTab('${escapeHTML(tab)}')">${escapeHTML(tab)}</button>`;
        }).join('');
    };

    const renderViews = () => {
        ['shop', 'orders', 'help', 'admin'].forEach(viewName => {
            const el = document.getElementById(`${viewName}-view`);
            if (el) {
                el.classList.toggle('view-hidden', state.view !== viewName);
            }
        });
    };

    const updateCartBadge = () => {
      const totalItems = state.cart.reduce((sum, item) => sum + item.qty, 0);
      const badge = document.querySelector('.shopping-cart-badge');
      if (badge) {
          badge.textContent = totalItems;
          badge.classList.toggle('hidden', totalItems === 0);
      }
    };

    const renderProducts = () => {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      const filteredProducts = state.products.filter(p => p.category === state.currentTab);
      if (filteredProducts.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl mb-2">inventory_2</span>
            <p>此分类下暂无商品。</p>
          </div>`;
        return;
      }
      grid.innerHTML = filteredProducts.map(product => {
        const qty = state.quantities[product.id] || 0;
        const outOfStock = product.stock <= 0;
        const btnDisabled = qty === 0 || outOfStock;
        const btnClasses = btnDisabled ? 'opacity-50 cursor-not-allowed grayscale' : 'hover:bg-primary-container';
        return `
          <div class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col hover:shadow-sm transition-shadow">
            <div class="flex justify-between items-start mb-sm">
              <div>
                <span class="bg-surface-container text-on-surface-variant font-label-md text-label-md px-2 py-1 rounded-full uppercase">${escapeHTML(product.type)}</span>
                <h3 class="font-headline-sm text-headline-sm mt-2 text-on-background">${escapeHTML(product.name)}</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">${escapeHTML(product.desc)}</p>
                <p class="font-label-md text-xs mt-1 text-on-surface-variant">库存: ${escapeHTML(String(product.stock))}</p>
              </div>
              <span class="material-symbols-outlined text-primary-container text-3xl">${escapeHTML(product.icon)}</span>
            </div>
            <div class="flex-grow"></div>
            <div class="flex justify-between items-end mt-4">
              <div class="font-headline-md text-headline-md font-bold text-primary">¥${product.price.toFixed(2)}</div>
              <div class="flex items-center gap-2">
                <div class="flex items-center border border-outline-variant rounded-lg">
                  <button class="btn-interact px-2 py-1 text-on-surface-variant hover:text-primary" onclick="updateQty('${escapeHTML(product.id)}', -1)" ${outOfStock ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">remove</span></button>
                  <span class="font-body-md text-body-md px-2 w-4 text-center">${qty}</span>
                  <button class="btn-interact px-2 py-1 text-on-surface-variant hover:text-primary" onclick="updateQty('${escapeHTML(product.id)}', 1)" ${outOfStock ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">add</span></button>
                </div>
                <button id="add-btn-${escapeHTML(product.id)}" class="btn-interact bg-primary text-on-primary font-label-md text-label-md px-4 py-2 rounded-lg transition-colors ${btnClasses} flex items-center justify-center gap-1 min-w-[70px]" onclick="addToCart('${escapeHTML(product.id)}')" ${btnDisabled ? 'disabled' : ''}><span>${outOfStock ? '已售罄' : '加入'}</span></button>
              </div>
            </div>
          </div>`;
      }).join('');
    };

    const renderCart = () => {
      const cartList = document.getElementById('cart-items-list');
      if (!cartList) return;
      let total = 0;
      if (state.cart.length === 0) {
        cartList.innerHTML = '<div class="text-center text-on-surface-variant py-4">您的购物车是空的</div>';
      } else {
        cartList.innerHTML = state.cart.map(item => {
          const product = state.products.find(p => p.id === item.id);
          const itemTotal = product.price * item.qty;
          total += itemTotal;
          return `
            <div class="flex justify-between items-center py-2 border-b border-outline-variant last:border-0">
              <div>
                <div class="font-bold">${escapeHTML(product.name)}</div>
                <div class="text-body-md text-on-surface-variant">${item.qty} x ¥${product.price.toFixed(2)}</div>
              </div>
              <div class="flex items-center gap-2">
                <div class="font-bold">¥${itemTotal.toFixed(2)}</div>
                <button class="text-error hover:text-on-error-container btn-interact" onclick="removeFromCart('${escapeHTML(item.id)}')">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            </div>`;
        }).join('');

      const cartTotalEl    = document.getElementById('cart-total');
      const paymentTotalEl = document.getElementById('payment-total');
      const payBtn         = document.getElementById('pay-btn');
      if (cartSubtotalEl)  cartSubtotalEl.textContent  = `¥${total.toFixed(2)}`;
      if (cartTotalEl)     cartTotalEl.textContent      = `¥${total.toFixed(2)}`;
      if (paymentTotalEl)  paymentTotalEl.textContent   = `¥${total.toFixed(2)}`;
      if (payBtn)          payBtn.disabled               = state.cart.length === 0;
    };

    const renderOrders = () => {
      const ordersContainer = document.getElementById('orders-list');
      if (!ordersContainer) return;

      if (state.ordersLoading) {
        ordersContainer.innerHTML = `<div class="text-center py-10"><div class="spinner mx-auto mb-3"></div><p class="text-on-surface-variant">加载订单中...</p></div>`;
        return;
      }

      const orders = state.userOrders;
      if (orders.length === 0) {
        ordersContainer.innerHTML = `
          <div class="text-center py-10 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl mb-2">receipt_long</span>
            <p>未找到任何订单。</p>
          </div>`;
        return;
      }

      ordersContainer.innerHTML = orders.map(order => {
        const statusStyle = statusStyles[order.status] || 'bg-surface-variant text-on-surface-variant';
        const isExpanded  = !!state.expandedOrders[order.id];
        const safeId      = escapeHTML(order.id);
        const safeStatus  = escapeHTML(order.status);
        const safeDate    = escapeHTML(order.date);
        const safeItems   = (order.items || []).map(i => `${escapeHTML(String(i.qty))}x ${escapeHTML(i.name)}`).join(', ');
        return `
        <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-sm">订单号: ${safeId}</span>
            <span class="text-xs px-2 py-1 rounded-full ${statusStyle}">${safeStatus}</span>
          </div>
          <div class="text-sm text-on-surface-variant mb-2">${safeItems}</div>
          <div class="flex justify-between items-center font-bold text-sm mb-2">
            <span>总计: ¥${order.total.toFixed(2)}</span>
            <span>${safeDate}</span>
          </div>
          ${order.status === '已发货' && order.accountInfo ? `
            <div class="mt-4 p-3 bg-surface border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-highest transition-colors" onclick="toggleOrderExpand('${safeId}')">
                <p class="font-bold text-sm text-primary mb-1 flex justify-between items-center">
                  发货信息:
                  <span class="material-symbols-outlined text-sm expand-icon transition-transform ${isExpanded ? 'rotate-180' : ''}">expand_more</span>
                </p>
                <p class="account-info-content text-sm font-mono-data whitespace-pre-wrap transition-all ${isExpanded ? '' : 'line-clamp-2'}">${escapeHTML(order.accountInfo)}</p>
            </div>
          ` : ''}
          ${order.status === '已退款' && order.refundReason ? `
            <div class="mt-2 text-sm text-error">
                <p>退款原因: ${escapeHTML(order.refundReason)}</p>
                <p>退款时间: ${escapeHTML(order.refundTime)}</p>
            </div>
          ` : ''}
        </div>`;
      }).join('');
    };

    window.toggleOrderExpand = (orderId) => {
      state.expandedOrders[orderId] = !state.expandedOrders[orderId];
      renderOrders();
    };

    // ── Help Page ────────────────────────────────────────────────────
    const renderHelpPage = () => {
        const container = document.getElementById('help-content');
        if (!container) return;
        const s = state.siteSettings;
        const ann = s.announcement || { enabled: false, title: '', content: '' };
        const contacts = Array.isArray(s.contacts) ? s.contacts : [];
        container.innerHTML = `
          ${ann.enabled && ann.content ? `
            <div class="bg-primary rounded-xl p-md mb-lg">
              <div class="flex items-center gap-2 mb-2">
                <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings:'FILL' 1;">campaign</span>
                <h3 class="font-bold text-white">${escapeHTML(ann.title || '店铺公告')}</h3>
              </div>
              <p class="text-sm text-white opacity-90 whitespace-pre-wrap">${escapeHTML(ann.content)}</p>
            </div>
          ` : ''}
          <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant mb-lg">
            <div class="flex items-center gap-2 mb-3">
              <span class="material-symbols-outlined text-primary">contact_support</span>
              <h3 class="font-bold">联系我们</h3>
            </div>
            <p class="text-sm text-on-surface-variant mb-4">需要帮助？请通过以下方式联系我们的支持团队。</p>
            ${contacts.length > 0 ? `
              <div class="space-y-2">
                ${contacts.map(c => `
                  <div class="flex items-center gap-3 p-3 bg-surface rounded-lg border border-outline-variant">
                    <span class="material-symbols-outlined text-primary text-lg">chat</span>
                    <div><p class="text-xs text-on-surface-variant">${escapeHTML(c.label)}</p><p class="font-bold text-sm whitespace-pre-wrap">${escapeHTML(c.value)}</p></div>
                  </div>`).join('')}
              </div>
            ` : '<p class="text-sm text-on-surface-variant italic">暂未设置联系方式。</p>'}
          </div>`;
    };

    // ── Admin Orders ────────────────────────────────────────────────
    const renderAdminOrders = () => {
      const adminContainer      = document.getElementById('admin-orders-list');
      const adminTabsContainer  = document.getElementById('admin-tabs-container');

      if (adminTabsContainer) {
          adminTabsContainer.innerHTML = `
            <button class="pb-2 ${state.adminTab === 'pending'  ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('pending')">待处理</button>
            <button class="pb-2 ${state.adminTab === 'shipped'  ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('shipped')">已发货/已退款</button>
            <button class="pb-2 ${state.adminTab === 'products' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('products')">商品管理</button>
            <button class="pb-2 ${state.adminTab === 'settings' ? 'border-b-2 border-primary text-primary font-bold' : 'text-on-surface-variant'} btn-interact admin-tab" onclick="switchAdminTab('settings')">网站设置</button>
          `;
      }

      let searchContainer = document.getElementById('admin-search-container');
      if (!searchContainer) {
          searchContainer = document.createElement('div');
          searchContainer.id = 'admin-search-container';
          searchContainer.className = 'mb-4';
          if (adminContainer && adminContainer.parentNode) {
              adminContainer.parentNode.insertBefore(searchContainer, adminContainer);
          }
      }

      if (state.adminTab === 'products') {
          searchContainer.innerHTML = '';
          if (!adminContainer) return;
          adminContainer.innerHTML = renderAdminProducts();
          return;
      }
      if (state.adminTab === 'settings') {
          searchContainer.innerHTML = '';
          if (!adminContainer) return;
          adminContainer.innerHTML = renderAdminSettings();
          return;
      }

      searchContainer.innerHTML = `
        <input id="admin-search-box" type="text"
          class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm"
          placeholder="搜索订单号 / 联系方式"
          value="${escapeHTML(state.adminSearch)}"
          oninput="window.onAdminSearch(this.value)"/>
      `;

      if (!adminContainer) return;

      if (state.adminOrdersLoading) {
        adminContainer.innerHTML = `<div class="text-center py-10"><div class="spinner mx-auto mb-3"></div><p class="text-on-surface-variant">加载中...</p></div>`;
        return;
      }

      const tabFiltered = state.allOrders.filter(o =>
          state.adminTab === 'pending'
            ? (o.status === '待确认' || o.status === '待发货')
            : (o.status === '已发货' || o.status === '已退款' || o.status === '已取消')
      );

      const keyword = state.adminSearch.trim();
      const filteredOrders = tabFiltered.filter(order => {
          if (!keyword) return true;
          return order.id.includes(keyword) || order.contact.includes(keyword);
      });

      if (filteredOrders.length === 0) {
        adminContainer.innerHTML = `<p class="text-center text-on-surface-variant py-4">无相关订单。</p>`;
        return;
      }

      adminContainer.innerHTML = filteredOrders.map(order => {
        const safeId      = escapeHTML(order.id);
        const safeContact = escapeHTML(order.contact);
        const safeCtType  = escapeHTML(order.contactType);
        const safePay     = escapeHTML(order.paymentMethod);
        const safeDate    = escapeHTML(order.date);
        const safeItems   = (order.items || []).map(i => `${escapeHTML(String(i.qty))}x ${escapeHTML(i.name)}`).join(', ');
        return `
        <div class="bg-surface-container-low p-md rounded-xl border border-outline-variant flex flex-col md:flex-row justify-between items-start md:items-center transition-all mb-4">
          <div class="mb-2 md:mb-0 w-full md:w-auto">
            <p class="font-bold flex items-center gap-2 flex-wrap">订单 #${safeId} <span class="text-xs px-2 py-1 rounded-full ${statusStyles[order.status] || ''}">${escapeHTML(order.status)}</span></p>
            <p class="text-body-md opacity-70">${safeItems}</p>
            <p class="text-sm font-bold text-primary mt-1">金额：¥${order.total.toFixed(2)}</p>
            <p class="text-sm text-primary mt-1">联系方式 (${safeCtType}): ${safeContact}</p>
            <p class="text-sm text-on-surface-variant">付款方式: ${safePay}</p>
            <p class="text-xs text-on-surface-variant mt-1">下单时间: ${safeDate}</p>
            ${order.status === '已发货' ? `
                <p class="text-xs text-on-surface-variant">发货时间: ${escapeHTML(order.shipTime || '—')}</p>
                <div class="mt-2 text-sm bg-surface p-2 rounded border border-outline-variant">
                    <button class="font-bold text-primary flex items-center justify-between w-full" onclick="toggleAdminOrderInfo(this)">查看发货信息 <span class="material-symbols-outlined text-sm">expand_more</span></button>
                    <div class="hidden mt-2 font-mono-data whitespace-pre-wrap break-all">${escapeHTML(order.accountInfo)}</div>
                </div>
            ` : ''}
            ${order.status === '已退款' ? `
                <p class="text-xs text-on-surface-variant">退款时间: ${escapeHTML(order.refundTime || '—')}</p>
                ${order.refundReason ? `<p class="text-sm text-error mt-1">退款原因: ${escapeHTML(order.refundReason)}</p>` : ''}
            ` : ''}
            ${order.status === '已取消' ? `
                <p class="text-xs text-on-surface-variant">取消时间: ${escapeHTML(order.cancelTime || '—')}</p>
            ` : ''}
          </div>
          <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0 flex-wrap justify-end">
          ${order.status === '待确认' ? `
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none" onclick="confirmPayment('${safeId}')">确认收款</button>
                <button class="bg-error-container text-on-error-container px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="refundOrder('${safeId}')">退款</button>
                <button class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="cancelOrder('${safeId}')">取消</button>
          ` : ''}
          ${order.status === '待发货' ? `
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none" onclick="openShipModal('${safeId}')">发货</button>
                <button class="bg-error-container text-on-error-container px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="refundOrder('${safeId}')">退款</button>
                <button class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-lg text-sm btn-interact flex-1 md:flex-none border border-outline-variant" onclick="cancelOrder('${safeId}')">取消</button>
          ` : ''}
          </div>
        </div>`;
      }).join('');
    };

    window.onAdminSearch = (value) => {
      state.adminSearch = value;
      renderAdminOrders();
    };

    // ── Admin: Cancel Order ─────────────────────────────────────────
    window.cancelOrder = async (orderId) => {
        if (!confirm(`确认取消订单 ${orderId}？此操作不可撤销。`)) return;
        try {
          const now = nowStr();
          await SB.updateOrder(orderId, { status: '已取消', cancel_time: now });
          const o = state.allOrders.find(o => o.id === orderId);
          if (o) { o.status = '已取消'; o.cancelTime = now; }
          // Also update userOrders if present
          const uo = state.userOrders.find(o => o.id === orderId);
          if (uo) { uo.status = '已取消'; uo.cancelTime = now; }
          render();
          showToast('订单已取消');
        } catch (e) { showToast('操作失败: ' + e.message, true); }
    };

    // ── Product & Category Management ───────────────────────────────
    const ICON_OPTIONS = ['smart_toy','call','alternate_email','language','apple','cloud','key','lock','vpn_key','devices','storage','wifi','public','shield'];

    const renderAdminProducts = () => {
        const cats = state.tabs;
        return `
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <h3 class="font-headline-sm text-headline-sm">商品列表</h3>
            <div class="flex gap-2">
              <button class="border border-outline-variant text-on-surface-variant px-3 py-2 rounded-lg text-sm btn-interact flex items-center gap-1 hover:bg-surface-container-low" onclick="openCategoryManager()">
                <span class="material-symbols-outlined text-sm">category</span>管理分类
              </button>
              <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact flex items-center gap-1" onclick="openProductModal()">
                <span class="material-symbols-outlined text-sm">add</span>添加商品
              </button>
            </div>
          </div>
          ${cats.map(cat => {
            const catProducts = state.products.filter(p => p.category === cat);
            return `
              <div class="mb-6">
                <p class="font-bold text-sm text-on-surface-variant mb-2 uppercase tracking-widest">${escapeHTML(cat)}${catProducts.length === 0 ? ' <span class="text-xs font-normal normal-case">(暂无商品)</span>' : ''}</p>
                ${catProducts.length > 0 ? `<div class="space-y-3">
                  ${catProducts.map(p => `
                    <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex justify-between items-center gap-4">
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="material-symbols-outlined text-primary text-2xl flex-shrink-0">${escapeHTML(p.icon)}</span>
                        <div class="min-w-0">
                          <p class="font-bold truncate">${escapeHTML(p.name)}</p>
                          <p class="text-sm text-on-surface-variant truncate">${escapeHTML(p.type)} · ${escapeHTML(p.desc)}</p>
                          <p class="text-sm text-primary font-bold">¥${p.price.toFixed(2)} <span class="text-on-surface-variant font-normal ml-2">库存: ${escapeHTML(String(p.stock))}</span></p>
                        </div>
                      </div>
                      <div class="flex gap-2 flex-shrink-0">
                        <button class="p-2 rounded-lg border border-outline-variant btn-interact hover:bg-surface-container-high" onclick="openProductModal('${escapeHTML(p.id)}')" title="编辑">
                          <span class="material-symbols-outlined text-sm">edit</span>
                        </button>
                        <button class="p-2 rounded-lg border border-error-container bg-error-container text-on-error-container btn-interact" onclick="deleteProduct('${escapeHTML(p.id)}')" title="删除">
                          <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>` : ''}
              </div>`;
          }).join('')}
          ${cats.length === 0 ? '<p class="text-center text-on-surface-variant py-8">暂无分类，请先添加分类。</p>' : ''}
        `;
    };

    // ── Admin Site Settings ─────────────────────────────────────────
    const renderAdminSettings = () => {
        const s = state.siteSettings;
        const ann = s.announcement || { enabled: false, title: '', content: '' };
        const contacts = Array.isArray(s.contacts) ? s.contacts : [];
        const contactRows = contacts.map((c, i) => `
          <div class="flex gap-1.5 items-center w-full min-w-0" id="con-row-${i}">
            <input type="text" class="w-20 flex-shrink-0 rounded-lg border border-outline-variant bg-surface px-2 py-2 text-sm font-bold" placeholder="名称" value="${escapeHTML(c.label)}" id="con-label-${i}" oninput="adminSettingsChanged()"/>
            <input type="text" class="min-w-0 flex-1 rounded-lg border border-outline-variant bg-surface px-2 py-2 text-sm" placeholder="联系内容" value="${escapeHTML(c.value)}" id="con-value-${i}" oninput="adminSettingsChanged()"/>
            <button class="flex-shrink-0 p-2 rounded-lg bg-error-container text-on-error-container btn-interact" onclick="removeContactRow(${i})" title="删除">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>
        `).join('');

        return `
          <div class="space-y-6">
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md">
              <div class="flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-primary">campaign</span>
                <h3 class="font-bold">公告栏</h3>
              </div>
              <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-bold">显示公告</label>
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" id="ann-enabled" class="sr-only peer" ${ann.enabled ? 'checked' : ''} onchange="adminSettingsChanged()"/>
                  <div class="w-11 h-6 bg-outline-variant rounded-full peer peer-checked:bg-primary transition-colors"></div>
                  <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform peer-checked:translate-x-5"></div>
                </label>
              </div>
              <div class="mb-3">
                <label class="text-sm font-bold mb-1 block">公告标题</label>
                <input id="ann-title" type="text" maxlength="40" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm" value="${escapeHTML(ann.title || '')}" placeholder="店铺公告" oninput="adminSettingsChanged()"/>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">公告内容</label>
                <textarea id="ann-content" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm min-h-[100px]" placeholder="输入公告内容..." oninput="adminSettingsChanged()">${escapeHTML(ann.content || '')}</textarea>
              </div>
            </div>
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-md">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-primary">contact_support</span>
                  <h3 class="font-bold">联系方式</h3>
                </div>
                <button class="flex items-center gap-1 text-sm text-primary border border-primary px-3 py-1 rounded-lg btn-interact hover:bg-primary-container" onclick="addContactRow()">
                  <span class="material-symbols-outlined text-sm">add</span>添加
                </button>
              </div>
              <div class="space-y-3" id="contacts-list">
                ${contactRows || '<p class="text-sm text-on-surface-variant italic" id="contacts-empty">暂无联系方式，点击添加。</p>'}
              </div>
              <p class="text-xs text-on-surface-variant mt-3">左侧填名称（如 Telegram），右侧填联系内容。</p>
            </div>
            <div class="flex items-center gap-3">
              <button id="admin-settings-save-btn" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-bold btn-interact" onclick="saveAdminSettings()">保存设置</button>
              <span id="admin-settings-saved-tip" class="text-sm text-primary hidden flex items-center gap-1"><span class="material-symbols-outlined text-sm">check_circle</span>已保存</span>
            </div>
          </div>`;
    };

    window.adminSettingsChanged = () => {
        const tip = document.getElementById('admin-settings-saved-tip');
        if (tip) tip.classList.add('hidden');
    };

    window.addContactRow = async () => {
        await window.saveAdminSettings(true);
        state.siteSettings.contacts.push({ id: 'c' + Date.now(), label: '', value: '' });
        renderAdminOrders();
    };

    window.removeContactRow = async (idx) => {
        await window.saveAdminSettings(true);
        state.siteSettings.contacts.splice(idx, 1);
        renderAdminOrders();
    };

    window.saveAdminSettings = async (silent = false) => {
        const s = state.siteSettings;
        const annEnabled = document.getElementById('ann-enabled');
        const annTitle   = document.getElementById('ann-title');
        const annContent = document.getElementById('ann-content');
        if (annEnabled !== null) {
            s.announcement = {
                enabled: annEnabled.checked,
                title:   annTitle   ? annTitle.value.trim()   : '',
                content: annContent ? annContent.value.trim() : ''
            };
        }
        // Collect contact rows
        const list = document.getElementById('contacts-list');
        if (list) {
            const newContacts = [];
            let i = 0;
            while (document.getElementById(`con-label-${i}`) !== null) {
                const label = document.getElementById(`con-label-${i}`).value.trim();
                const value = document.getElementById(`con-value-${i}`).value.trim();
                if (label || value) newContacts.push({ id: (s.contacts[i] && s.contacts[i].id) || ('c' + Date.now() + i), label, value });
                i++;
            }
            s.contacts = newContacts;
        }

        try {
          await SB.upsertSiteSetting('announcement', s.announcement);
          await SB.upsertSiteSetting('contacts', s.contacts);
          if (!silent) {
              const tip = document.getElementById('admin-settings-saved-tip');
              if (tip) { tip.classList.remove('hidden'); setTimeout(() => tip.classList.add('hidden'), 2500); }
              showToast('设置已保存');
          }
        } catch (e) {
          showToast('保存失败: ' + e.message, true);
        }
    };

    // ── Category Manager ────────────────────────────────────────────
    window.openCategoryManager = () => {
        const existing = document.getElementById('cat-manager-modal');
        if (existing) existing.remove();
        const modal = document.createElement('div');
        modal.id = 'cat-manager-modal';
        modal.className = 'fixed inset-0 z-[125] flex items-center justify-center p-4';
        modal.innerHTML = buildCategoryManagerHTML();
        document.body.appendChild(modal);
    };

    const buildCategoryManagerHTML = () => {
        const cats = state.tabs;
        const listItems = cats.map((cat, idx) => `
          <div class="flex items-center gap-2 bg-surface-container-low border border-outline-variant rounded-lg px-3 py-2" id="cat-item-${idx}">
            <span class="material-symbols-outlined text-on-surface-variant text-sm flex-shrink-0">drag_indicator</span>
            <span class="flex-1 text-sm font-bold truncate">${escapeHTML(cat)}</span>
            <button class="p-1 rounded hover:bg-surface-container-high btn-interact text-primary" onclick="editCategoryInline(${idx})" title="重命名">
              <span class="material-symbols-outlined text-sm">edit</span>
            </button>
            <button class="p-1 rounded hover:bg-error-container btn-interact text-error" onclick="deleteCategoryByIndex(${idx})" title="删除">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>`).join('');
        return `
          <div class="absolute inset-0 modal-backdrop" onclick="closeCategoryManager()"></div>
          <div class="bg-surface w-full max-w-md rounded-2xl p-lg relative z-10 shadow-xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-headline-md text-headline-md">管理分类</h3>
              <button class="text-on-surface-variant hover:text-primary btn-interact" onclick="closeCategoryManager()">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2 mb-4 min-h-[100px]">
              ${listItems || '<p class="text-center text-on-surface-variant py-4 text-sm">暂无分类</p>'}
            </div>
            <div class="border-t border-outline-variant pt-4">
              <p class="text-sm font-bold mb-2">添加新分类</p>
              <div class="flex gap-2">
                <input id="new-cat-input" type="text" maxlength="30" placeholder="输入分类名称" class="flex-1 rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm"/>
                <button class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm btn-interact font-bold" onclick="addNewCategory()">添加</button>
              </div>
            </div>
          </div>`;
    };

    window.closeCategoryManager = () => {
        const m = document.getElementById('cat-manager-modal');
        if (m) m.remove();
    };

    window.addNewCategory = async () => {
        const input = document.getElementById('new-cat-input');
        const name = input ? input.value.trim() : '';
        if (!name) { alert('请输入分类名称'); return; }
        if (state.tabs.includes(name)) { alert('该分类已存在'); return; }
        state.tabs.push(name);
        try {
          await SB.saveCategories(state.tabs);
        } catch (e) { showToast('保存分类失败: ' + e.message, true); }
        render();
        openCategoryManager();
    };

    window.editCategoryInline = (idx) => {
        const oldName = state.tabs[idx];
        const item = document.getElementById(`cat-item-${idx}`);
        if (!item) return;
        item.innerHTML = `
          <input id="edit-cat-${idx}" type="text" maxlength="30" class="flex-1 rounded border border-outline-variant bg-surface px-2 py-1 text-sm font-bold" value="${escapeHTML(oldName)}"/>
          <button class="p-1 rounded bg-primary text-on-primary btn-interact text-sm" onclick="saveCategoryEdit(${idx})">
            <span class="material-symbols-outlined text-sm">check</span>
          </button>
          <button class="p-1 rounded border border-outline-variant btn-interact" onclick="openCategoryManager()">
            <span class="material-symbols-outlined text-sm">close</span>
          </button>`;
        const inp = document.getElementById(`edit-cat-${idx}`);
        if (inp) { inp.focus(); inp.select(); }
    };

    window.saveCategoryEdit = async (idx) => {
        const inp = document.getElementById(`edit-cat-${idx}`);
        const newName = inp ? inp.value.trim() : '';
        if (!newName) { alert('分类名称不能为空'); return; }
        const oldName = state.tabs[idx];
        if (newName !== oldName && state.tabs.includes(newName)) { alert('该分类名称已存在'); return; }
        state.products.forEach(p => { if (p.category === oldName) p.category = newName; });
        state.tabs[idx] = newName;
        if (state.currentTab === oldName) state.currentTab = newName;
        try {
          await SB.saveCategories(state.tabs);
          // Update products in cloud
          const toUpdate = state.products.filter(p => p.category === newName);
          await Promise.all(toUpdate.map(p => SB.updateProduct(p.id, { category: newName }).catch(() => {})));
        } catch (e) { showToast('保存失败: ' + e.message, true); }
        render();
        openCategoryManager();
    };

    window.deleteCategoryByIndex = async (idx) => {
        const name = state.tabs[idx];
        const hasProducts = state.products.some(p => p.category === name);
        if (hasProducts) {
            if (!confirm(`分类"${name}"下有商品，删除后这些商品将失去分类（仍保留在系统中）。确认删除？`)) return;
        } else {
            if (!confirm(`确认删除分类"${name}"？`)) return;
        }
        state.tabs.splice(idx, 1);
        if (state.currentTab === name) state.currentTab = state.tabs[0] || '';
        try { await SB.saveCategories(state.tabs); } catch (e) { showToast('保存失败: ' + e.message, true); }
        render();
        openCategoryManager();
    };

    // ── Product Modal ───────────────────────────────────────────────
    window.openProductModal = (productId) => {
        const existing = productId ? state.products.find(p => p.id === productId) : null;
        const iconOpts = ICON_OPTIONS.map(ic =>
            `<option value="${ic}" ${existing && existing.icon === ic ? 'selected' : (!existing && ic === 'smart_toy' ? 'selected' : '')}>${ic}</option>`
        ).join('');
        const catOpts = state.tabs.map(c =>
            `<option value="${escapeHTML(c)}" ${existing && existing.category === c ? 'selected' : ''}>${escapeHTML(c)}</option>`
        ).join('');

        const modal = document.createElement('div');
        modal.id = 'product-modal';
        modal.className = 'fixed inset-0 z-[120] flex items-center justify-center p-4';
        modal.innerHTML = `
          <div class="absolute inset-0 modal-backdrop" onclick="closeProductModal()"></div>
          <div class="bg-surface w-full max-w-md rounded-2xl p-lg relative z-10 shadow-xl max-h-[90vh] overflow-y-auto">
            <h3 class="font-headline-md text-headline-md mb-4">${existing ? '编辑商品' : '添加商品'}</h3>
            <div class="space-y-3">
              <div>
                <label class="text-sm font-bold mb-1 block">商品名称</label>
                <input id="pm-name" type="text" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? escapeHTML(existing.name) : ''}"/>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">类型标签（如：共享账号）</label>
                <input id="pm-type" type="text" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? escapeHTML(existing.type) : ''}"/>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">描述</label>
                <input id="pm-desc" type="text" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? escapeHTML(existing.desc) : ''}"/>
              </div>
              <div class="flex gap-3">
                <div class="flex-1">
                  <label class="text-sm font-bold mb-1 block">价格 (¥)</label>
                  <input id="pm-price" type="number" min="0" step="0.01" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? existing.price : ''}"/>
                </div>
                <div class="flex-1">
                  <label class="text-sm font-bold mb-1 block">库存</label>
                  <input id="pm-stock" type="number" min="0" step="1" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? existing.stock : ''}"/>
                </div>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">排序（数字越小越靠前）</label>
                <input id="pm-sort" type="number" min="0" step="1" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2" value="${existing ? (existing.sort_order || 0) : 0}"/>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">分类</label>
                <select id="pm-category" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2">${catOpts}</select>
              </div>
              <div>
                <label class="text-sm font-bold mb-1 block">图标</label>
                <select id="pm-icon" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2">${iconOpts}</select>
              </div>
            </div>
            <div class="flex gap-3 mt-6">
              <button class="flex-1 py-2 border border-outline-variant rounded-xl font-bold btn-interact hover:bg-surface-container-low" onclick="closeProductModal()">取消</button>
              <button class="flex-1 py-2 bg-primary text-on-primary rounded-xl font-bold btn-interact" onclick="saveProduct('${escapeHTML(productId || '')}')">保存</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
    };

    window.closeProductModal = () => {
        const m = document.getElementById('product-modal');
        if (m) m.remove();
    };

    window.saveProduct = async (productId) => {
        const name     = document.getElementById('pm-name').value.trim();
        const type     = document.getElementById('pm-type').value.trim();
        const desc     = document.getElementById('pm-desc').value.trim();
        const price    = parseFloat(document.getElementById('pm-price').value);
        const stock    = parseInt(document.getElementById('pm-stock').value, 10);
        const sortEl   = document.getElementById('pm-sort');
        const sort_order = sortEl ? (parseInt(sortEl.value, 10) || 0) : 0;
        const category = document.getElementById('pm-category').value;
        const icon     = document.getElementById('pm-icon').value;

        if (!name || !type || !desc || isNaN(price) || isNaN(stock)) {
            alert('请填写所有字段');
            return;
        }

        showLoading('保存中...');
        try {
          if (productId) {
              const idx = state.products.findIndex(p => p.id === productId);
              const updated = { id: productId, name, type, desc, price, stock, category, icon, sort_order };
              if (idx > -1) state.products[idx] = updated;
              await SB.updateProduct(productId, { name, type, desc, price, stock, category, icon, sort_order });
          } else {
              const newProduct = {
                  id: 'p' + Date.now(),
                  category, type, name, desc, price, icon, stock, sort_order
              };
              state.products.push(newProduct);
              state.quantities[newProduct.id] = 0;
              await SB.upsertProduct(newProduct, true);
          }
          closeProductModal();
          render();
          showToast('商品已保存');
        } catch (e) {
          showToast('保存失败: ' + e.message, true);
        } finally {
          hideLoading();
        }
    };

    window.deleteProduct = async (productId) => {
        const product = state.products.find(p => p.id === productId);
        if (!product) return;
        if (!confirm(`确认删除商品"${product.name}"？此操作不可撤销。`)) return;
        showLoading('删除中...');
        try {
          await SB.deleteProduct(productId);
          state.products = state.products.filter(p => p.id !== productId);
          delete state.quantities[productId];
          render();
          showToast('商品已删除');
        } catch (e) {
          showToast('删除失败: ' + e.message, true);
        } finally {
          hideLoading();
        }
    };

    // ── Checkout Modal ──────────────────────────────────────────────
    const renderCheckoutModal = () => {
        const modal = document.getElementById('checkout-modal');
        if (!modal) return;
        if (state.showCheckoutModal) {
            modal.classList.remove('hidden');
            [1, 2, 3, 4].forEach(step => {
                const el = document.getElementById(`step-${step}`);
                if (el) el.classList.toggle('hidden', state.checkoutStep !== step);
            });
            if (state.checkoutStep === 1) renderCart();
            if (state.checkoutStep === 2) {
                const payTabWechat = document.getElementById('pay-tab-wechat');
                const payTabAlipay = document.getElementById('pay-tab-alipay');
                const qrWechat = document.getElementById('qr-wechat');
                const qrAlipay = document.getElementById('qr-alipay');
                const paidBtn  = document.getElementById('paid-btn');
                const confirmCb = document.getElementById('payment-confirm-cb');
                if (state.paymentMethod === 'wechat') {
                    payTabWechat?.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabWechat?.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    payTabAlipay?.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabAlipay?.classList.add('bg-surface-variant', 'text-on-surface-variant');
                    qrWechat?.classList.remove('hidden');
                    qrAlipay?.classList.add('hidden');
                } else {
                    payTabAlipay?.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabAlipay?.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    payTabWechat?.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    payTabWechat?.classList.add('bg-surface-variant', 'text-on-surface-variant');
                    qrAlipay?.classList.remove('hidden');
                    qrWechat?.classList.add('hidden');
                }
                if (state.paymentTimeLeft > 0) {
                    paidBtn.textContent = `请等待 ${state.paymentTimeLeft}s`;
                    paidBtn.disabled = true;
                    confirmCb.checked = false;
                } else {
                    paidBtn.textContent = '我已支付';
                    paidBtn.disabled = !state.paymentReady;
                    confirmCb.checked = state.paymentReady;
                }
            }
            if (state.checkoutStep === 3) {
                const submitBtn = document.getElementById('submit-order-btn');
                if (submitBtn) {
                    submitBtn.textContent = state.submittingOrder ? '提交中...' : '提交订单';
                    submitBtn.disabled = state.submittingOrder;
                }
            }
            if (state.checkoutStep === 4) {
                const idEl      = document.getElementById('success-order-id');
                const contactEl = document.getElementById('success-contact');
                if (idEl)      idEl.textContent      = state.lastOrderId;
                if (contactEl) contactEl.textContent  = `${state.lastContactInfo.type}: ${state.lastContactInfo.contact}`;
            }
        } else {
            modal.classList.add('hidden');
        }
    };

    const renderShipModal = () => {
        const modal = document.getElementById('ship-modal');
        if (!modal) return;
        modal.classList.toggle('hidden', !state.showShipModal);
    };

    // ── Actions ─────────────────────────────────────────────────────
    window.switchView = async (viewName) => {
      if (viewName === 'admin' && !state.adminAuthed) return;
      state.view = viewName;
      if (viewName === 'admin' && state.allOrders.length === 0) {
          state.adminOrdersLoading = true;
          render();
          await loadAdminOrders();
      }
      if (viewName === 'orders') {
          state.ordersLoading = true;
          render();
          await loadUserOrders();
      }
      render();
    };

    window.switchTab = (tabName) => {
      state.currentTab = tabName;
      render();
    };

    window.switchAdminTab = async (tabName) => {
      state.adminTab = tabName;
      if ((tabName === 'pending' || tabName === 'shipped') && state.allOrders.length === 0) {
          state.adminOrdersLoading = true;
          render();
          await loadAdminOrders();
      }
      render();
    };

    window.updateQty = (id, delta) => {
      state.quantities[id] = Math.max(0, (state.quantities[id] || 0) + delta);
      const product = state.products.find(p => p.id === id);
      if (product && state.quantities[id] > product.stock) state.quantities[id] = product.stock;
      render();
    };

    window.addToCart = (id) => {
      const qty     = state.quantities[id] || 0;
      const product = state.products.find(p => p.id === id);
      if (qty > 0 && product) {
        if (qty > product.stock) { alert('库存不足'); return; }
        const existingItem   = state.cart.find(item => item.id === id);
        const currentCartQty = existingItem ? existingItem.qty : 0;
        if (currentCartQty + qty > product.stock) { alert('购物车总数量超出库存'); return; }
        if (existingItem) { existingItem.qty += qty; }
        else              { state.cart.push({ id, qty }); }
        state.quantities[id] = 0;
        const btn = document.getElementById(`add-btn-${id}`);
        if (btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
            btn.classList.add('bg-secondary');
            setTimeout(() => {
              const latestBtn = document.getElementById(`add-btn-${id}`);
              if (!latestBtn) return;
              latestBtn.innerHTML = originalHTML;
              latestBtn.classList.remove('bg-secondary');
            }, 1000);
        }
        render();
      }
    };

    window.removeFromCart = (id) => {
        state.cart = state.cart.filter(item => item.id !== id);
        render();
    };

    window.toggleCheckoutModal = (show) => {
      state.showCheckoutModal = show;
      if (show) { setCheckoutStep(1); }
      else {
          if (window.paymentTimer) { clearInterval(window.paymentTimer); window.paymentTimer = null; }
      }
      render();
    };

    window.setCheckoutStep = (step) => {
      state.checkoutStep = step;
      if (step === 2) {
          if (window.paymentTimer) { clearInterval(window.paymentTimer); window.paymentTimer = null; }
          state.paymentReady   = false;
          state.paymentTimeLeft = 5;
          window.paymentTimer  = setInterval(() => {
              state.paymentTimeLeft--;
              if (state.paymentTimeLeft <= 0) { clearInterval(window.paymentTimer); window.paymentTimer = null; }
              render();
          }, 1000);
      }
      render();
    };

    window.togglePaymentReady = (checked) => {
        state.paymentReady = checked;
        render();
    };

    window.switchPaymentMethod = (method) => {
      state.paymentMethod = method;
      render();
    };

    // ── Submit Order (cloud) ─────────────────────────────────────────
    window.submitOrder = async () => {
      if (state.cart.length === 0) { alert('购物车为空'); return; }
      if (state.submittingOrder)   return;

      const contactInput = document.getElementById('contact-input').value;
      const contactType  = document.getElementById('contact-type').value;
      if (contactInput.length < 5) { alert('请输入至少5个字符的联系方式'); return; }

      state.submittingOrder = true;
      render();

      try {
          let total = 0;
          const orderItems = state.cart.map(item => {
            const product = state.products.find(p => p.id === item.id);
            total += product.price * item.qty;
            return { id: item.id, qty: item.qty, name: product.name, type: product.type };
          });

          const orderId = 'ORD-' + Date.now().toString(36).toUpperCase();
          state.lastOrderId      = orderId;
          state.lastContactInfo  = { type: contactType, contact: contactInput };

          const now = nowStr();
          const dbOrder = {
            id:             orderId,
            date:           now,
            items:          orderItems,
            total:          total,
            status:         '待确认',
            contact:        contactInput,
            contact_type:   contactType,
            payment_method: state.paymentMethod === 'wechat' ? '微信' : '支付宝'
          };

          await SB.insertOrder(dbOrder);

          // Remember this order ID locally
          addLocalOrderId(orderId);

          // Add to userOrders immediately so user sees it
          state.userOrders.unshift(mapDbOrder(dbOrder));

          state.cart = [];
          state.products.forEach(p => state.quantities[p.id] = 0);
          state.checkoutStep = 4;

      } catch (e) {
          console.error('Order submission failed', e);
          alert('订单提交失败: ' + e.message);
      } finally {
          state.submittingOrder = false;
          render();
      }
    };

    window.finishCheckout = () => {
      state.showCheckoutModal = false;
      if (window.paymentTimer) { clearInterval(window.paymentTimer); window.paymentTimer = null; }
      state.view = 'orders';
      render();
    };

    window.refreshOrders = async () => {
      state.ordersLoading = true;
      render();
      await loadUserOrders();
      render();
    };

    window.refreshAdminOrders = async () => {
      state.adminOrdersLoading = true;
      render();
      await loadAdminOrders();
      render();
    };

    // ── Admin Actions (all write to cloud) ──────────────────────────
    window.confirmPayment = async (orderId) => {
        try {
          await SB.updateOrder(orderId, { status: '待发货' });
          const o = state.allOrders.find(o => o.id === orderId);
          if (o) o.status = '待发货';
          const uo = state.userOrders.find(o => o.id === orderId);
          if (uo) uo.status = '待发货';
          render();
          showToast('已确认收款');
        } catch (e) { showToast('操作失败: ' + e.message, true); }
    };

    window.openShipModal = (orderId) => {
        state.shipOrderId   = orderId;
        state.showShipModal = true;
        const infoEl = document.getElementById('ship-account-info');
        if (infoEl) infoEl.value = '';
        render();
    };

    window.closeShipModal = () => {
        state.showShipModal = false;
        state.shipOrderId   = null;
        render();
    };

    window.confirmShipment = async () => {
        const accountInfo = document.getElementById('ship-account-info').value;
        if (!accountInfo) { alert('请输入账号信息'); return; }

        const order = state.allOrders.find(o => o.id === state.shipOrderId);
        if (!order) { alert('订单不存在'); return; }

        // Inventory check
        for (const item of order.items) {
            const product = state.products.find(p => p.id === item.id);
            if (!product || product.stock < item.qty) {
                alert(`库存不足，无法发货 (${item.name})`);
                return;
            }
        }

        showLoading('发货中...');
        try {
          const now = nowStr();
          await SB.updateOrder(state.shipOrderId, {
            status:       '已发货',
            account_info: accountInfo,
            ship_time:    now
          });

          // Deduct stock
          for (const item of order.items) {
              const product = state.products.find(p => p.id === item.id);
              if (product) {
                  const newStock = Math.max(0, product.stock - item.qty);
                  await SB.updateProduct(product.id, { stock: newStock });
                  product.stock = newStock;
              }
          }

          // Update local state
          order.status      = '已发货';
          order.accountInfo = accountInfo;
          order.shipTime    = now;
          const uo = state.userOrders.find(o => o.id === state.shipOrderId);
          if (uo) { uo.status = '已发货'; uo.accountInfo = accountInfo; uo.shipTime = now; }

          state.showShipModal = false;
          state.shipOrderId   = null;
          render();
          showToast('发货成功');
        } catch (e) {
          showToast('发货失败: ' + e.message, true);
        } finally {
          hideLoading();
        }
    };

    window.refundOrder = (orderId) => {
        const existing = document.getElementById('refund-modal');
        if (existing) existing.remove();
        const modal = document.createElement('div');
        modal.id = 'refund-modal';
        modal.className = 'fixed inset-0 z-[150] flex items-center justify-center p-4';
        modal.innerHTML = `
          <div class="absolute inset-0 modal-backdrop" onclick="document.getElementById('refund-modal').remove()"></div>
          <div class="bg-surface w-full max-w-sm rounded-2xl p-lg relative z-10 shadow-xl">
            <h3 class="font-headline-md text-headline-md mb-1">退款确认</h3>
            <p class="text-sm text-on-surface-variant mb-4">订单 #${escapeHTML(orderId)}</p>
            <div class="mb-4">
              <label class="text-sm font-bold mb-1 block">退款原因</label>
              <textarea id="refund-reason-input" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-2 text-sm min-h-[80px]" placeholder="请输入退款原因（可选）"></textarea>
            </div>
            <div class="flex gap-3">
              <button class="flex-1 py-2 border border-outline-variant rounded-xl font-bold btn-interact"
                onclick="document.getElementById('refund-modal').remove()">取消</button>
              <button class="flex-1 py-2 bg-error text-on-error rounded-xl font-bold btn-interact"
                onclick="confirmRefund('${escapeHTML(orderId)}')">确认退款</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
        setTimeout(() => modal.querySelector('#refund-reason-input').focus(), 50);
    };

    window.confirmRefund = async (orderId) => {
        const reasonEl = document.getElementById('refund-reason-input');
        const reason   = reasonEl ? reasonEl.value.trim() : '';
        const modal    = document.getElementById('refund-modal');
        if (modal) modal.remove();

        const order = state.allOrders.find(o => o.id === orderId);
        if (!order) return;
        if (order.status === '已退款') { alert('订单已退款，不能重复退款'); return; }

        showLoading('退款处理中...');
        try {
          const previousStatus = order.status;
          const now = nowStr();
          await SB.updateOrder(orderId, {
            status:        '已退款',
            refund_reason: reason || '未提供原因',
            refund_time:   now
          });

          if (previousStatus === '已发货') {
              for (const item of order.items) {
                  const product = state.products.find(p => p.id === item.id);
                  if (product) {
                      const newStock = product.stock + item.qty;
                      await SB.updateProduct(product.id, { stock: newStock });
                      product.stock = newStock;
                  }
              }
          }

          order.status      = '已退款';
          order.refundReason = reason || '未提供原因';
          order.refundTime   = now;
          const uo = state.userOrders.find(o => o.id === orderId);
          if (uo) { uo.status = '已退款'; uo.refundReason = order.refundReason; uo.refundTime = now; }

          render();
          showToast('退款已处理');
        } catch (e) {
          showToast('退款失败: ' + e.message, true);
        } finally {
          hideLoading();
        }
    };

    window.logoutAdmin = () => {
      state.adminAuthed = false;
      clearAdminSession();
      state.view = 'shop';
      render();
    };

    window.toggleAdminOrderInfo = (el) => {
        const content = el.nextElementSibling;
        content.classList.toggle('hidden');
    };

    // ── Helpers ─────────────────────────────────────────────────────
    function nowStr() {
      return new Date().toLocaleDateString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // ── Security: PBKDF2 password verification ──────────────────────
    const ADMIN_SALT = 'globalshop_s@lt_2025_x9z';
    const ADMIN_HASH = '8648cf6591ed75f3828b3414c0c74c2cfa684eac2aebec82be50b9b2e5c8dca4'; // default: admin123

    async function pbkdf2Hash(password, salt, iterations = 150000) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
        );
        const bits = await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: enc.encode(salt), iterations, hash: 'SHA-256' },
            keyMaterial, 256
        );
        return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.generateAdminHash = async (pw) => {
        const h = await pbkdf2Hash(pw, ADMIN_SALT);
        console.log('%c Admin PBKDF2 Hash:', 'color:green;font-weight:bold', h);
        return h;
    };

    // ── Login lockout ────────────────────────────────────────────────
    const LOCKOUT_KEY  = 'admin_lockout';
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_MS   = 5 * 60 * 1000;

    const getLockout = () => {
        try { return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || { attempts: 0, until: 0 }; }
        catch (e) { return { attempts: 0, until: 0 }; }
    };
    const saveLockout = (data) => localStorage.setItem(LOCKOUT_KEY, JSON.stringify(data));
    const isLockedOut = () => { const { until } = getLockout(); return Date.now() < until; };
    const recordFailedAttempt = () => {
        const d = getLockout();
        d.attempts++;
        if (d.attempts >= MAX_ATTEMPTS) { d.until = Date.now() + LOCKOUT_MS; d.attempts = 0; }
        saveLockout(d);
    };
    const clearLockout = () => saveLockout({ attempts: 0, until: 0 });

    // ── Admin Session ────────────────────────────────────────────────
    const ADMIN_SESSION_KEY      = 'admin_session';
    const ADMIN_SESSION_DURATION = 10 * 60 * 1000;

    const isAdminSessionValid = () => {
        try {
            const s = JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY));
            if (!s) return false;
            return (Date.now() - s.timestamp) < ADMIN_SESSION_DURATION && s.ua === navigator.userAgent;
        } catch (e) { return false; }
    };
    const saveAdminSession  = () => localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ timestamp: Date.now(), ua: navigator.userAgent }));
    const clearAdminSession = () => localStorage.removeItem(ADMIN_SESSION_KEY);

    // ── Admin login modal ────────────────────────────────────────────
    function showAdminLoginModal() {
        const existing = document.getElementById('admin-login-modal');
        if (existing) existing.remove();
        const modal = document.createElement('div');
        modal.id = 'admin-login-modal';
        modal.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4';
        modal.innerHTML = `
          <div class="absolute inset-0 modal-backdrop"></div>
          <div class="bg-surface w-full max-w-xs rounded-2xl p-lg relative z-10 shadow-xl">
            <h3 class="font-headline-md text-headline-md mb-4 text-center">管理员登录</h3>
            <div id="admin-login-error" class="hidden mb-3 text-sm text-error bg-error-container rounded-lg px-3 py-2"></div>
            <div class="mb-4">
              <label class="text-sm font-bold mb-1 block">密码</label>
              <input id="admin-login-pw" type="password" class="w-full rounded-lg border border-outline-variant bg-surface px-3 py-3"
                placeholder="请输入管理员密码" autocomplete="current-password"/>
            </div>
            <div class="flex gap-3">
              <button class="flex-1 py-2 border border-outline-variant rounded-xl font-bold btn-interact"
                onclick="document.getElementById('admin-login-modal').remove()">取消</button>
              <button id="admin-login-btn" class="flex-1 py-2 bg-primary text-on-primary rounded-xl font-bold btn-interact"
                onclick="submitAdminLogin()">登录</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
        modal.querySelector('#admin-login-pw').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitAdminLogin();
        });
        setTimeout(() => modal.querySelector('#admin-login-pw').focus(), 50);
    }

    window.submitAdminLogin = async () => {
        if (isLockedOut()) {
            const { until } = getLockout();
            const mins = Math.ceil((until - Date.now()) / 60000);
            document.getElementById('admin-login-error').textContent = `登录已锁定，请 ${mins} 分钟后重试`;
            document.getElementById('admin-login-error').classList.remove('hidden');
            return;
        }
        const pw = document.getElementById('admin-login-pw').value;
        if (!pw) return;
        const btn = document.getElementById('admin-login-btn');
        btn.textContent = '验证中...';
        btn.disabled    = true;
        const hash = await pbkdf2Hash(pw, ADMIN_SALT);
        if (hash === ADMIN_HASH) {
            clearLockout();
            saveAdminSession();
            state.adminAuthed = true;
            document.getElementById('admin-login-modal').remove();
            state.view = 'admin';
            state.adminOrdersLoading = true;
            render();
            await loadAdminOrders();
            render();
        } else {
            recordFailedAttempt();
            const d = getLockout();
            const remaining = MAX_ATTEMPTS - d.attempts;
            const errEl = document.getElementById('admin-login-error');
            errEl.textContent = isLockedOut()
                ? '密码错误次数过多，已锁定 5 分钟'
                : `密码错误，还剩 ${remaining} 次机会`;
            errEl.classList.remove('hidden');
            btn.textContent = '登录';
            btn.disabled    = false;
            document.getElementById('admin-login-pw').value = '';
            document.getElementById('admin-login-pw').focus();
        }
    };

    // ── Hidden Gesture Logic ─────────────────────────────────────────
    const triggerEl = document.getElementById('admin-secret-trigger');
    if (triggerEl) {
        triggerEl.addEventListener('click', () => {
            state.adminClickCount++;
            clearTimeout(state.adminClickTimer);
            state.adminClickTimer = setTimeout(() => { state.adminClickCount = 0; }, 3000);
            if (state.adminClickCount >= 5) {
                state.adminClickCount = 0;
                if (navigator.vibrate) navigator.vibrate(80);
                if (isAdminSessionValid()) {
                    state.adminAuthed = true;
                    state.view = 'admin';
                    state.adminOrdersLoading = true;
                    render();
                    loadAdminOrders().then(() => render());
                    return;
                }
                showAdminLoginModal();
            }
        });
    }

    // Initialize
    render();
  });
</script>
